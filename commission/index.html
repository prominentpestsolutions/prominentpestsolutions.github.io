<style>
:root{--bg:#f2f4ee;--surface:#fff;--sunk:#e8ece2;--ink:#111410;--muted:#596052;--line:#d6dccd;--accent:#89c43e;--accent-ink:#0b0d09;--accent-soft:#e7f3d6;--ok:#4a7a17;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
input[type=search]{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font:700 1.3rem/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.person{min-height:120px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;gap:6px;padding:16px;cursor:pointer;text-align:center}
.person b{font:700 1.6rem/1 var(--display);text-transform:uppercase}
.person span{font-size:.85rem;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:grid;gap:12px;max-width:440px}
.box input{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:600 1.15rem var(--body)}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--ok);font-weight:600;cursor:pointer;padding:0;justify-self:start}
.err{color:#b3261e;margin:0;font-weight:600}
.muted{color:var(--muted);margin:0}
.owed{background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 16px;display:grid;gap:4px}
.owed .k{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.75}
.owed .v{font:700 3rem/1 var(--display)}
.owed .s{opacity:.85;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.stat .k{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.stat .v{font:700 1.8rem/1.05 var(--display)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.sale{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.sale:first-of-type{border-top:0;padding-top:0}
.sale b{font-weight:600}.sale .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.sale .d{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-weight:700;color:var(--muted);font-size:1.3rem}
details.card[open] summary::after{content:"–"}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
</style>

(function(){
var API_URL='https://script.google.com/macros/s/AKfycbxo4fckh7oI-qBhFa1qK_7597w_yS4p43mspjgEG7k0DzNAUEFPfAtTxGfDWJM3GNG6Xw/exec';
var app=document.getElementById('app'), S={list:null,who:'',pw:'',data:null,view:'pick',err:'',busy:false};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(fn,args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Error');return j.data;});}
function money(n){return n==null?'—':'$'+Math.round(n).toLocaleString();}
function ss(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){}}
function sg(k){try{return sessionStorage.getItem(k)||'';}catch(e){return '';}}
function person(){return (S.list||[]).filter(function(p){return p.key===S.who;})[0]||{name:''};}
function loadList(){api('commList',[]).then(function(l){S.list=l;render();}).catch(function(e){S.err=String(e.message||e);render();});}
function open(){S.busy=true;S.err='';render();api('commData',[S.who,S.pw]).then(function(d){S.data=d;S.view='data';S.busy=false;ss('comm.'+S.who,S.pw);render();})
  .catch(function(e){S.busy=false;S.err=String(e.message||e);ss('comm.'+S.who,null);S.view='pw';render();});}
function head(){return '<a class="back" href="/">← All tools</a><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Commissions</b><span class="eyebrow">Sales and commission owed</span></div></div>';}
function vPick(){if(!S.list) return '<p class="muted">'+(S.err?esc(S.err):'Loading…')+'</p>';
  return '<div class="people">'+S.list.map(function(p){return '<button class="person" data-who="'+p.key+'"><b>'+esc(p.name)+'</b><span>'+(p.hasPw?'Password protected':'Set up a password')+'</span></button>';}).join('')+'</div><p class="muted">Each person opens their own tracker with their password. Management can open any tracker with the master password.</p>';}
function vPw(){var p=person();return '<form class="box" data-f="open"><h2>'+esc(p.name)+'</h2><p class="muted">Enter your password, or the management master password.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button class="btn" '+(S.busy?'disabled':'')+'>'+(S.busy?'Checking…':'Open')+'</button>'+(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'<button type="button" class="link" data-a="back">← Back</button></form>';}
function vSet(first){var p=person();return '<form class="box" data-f="set"><h2>'+(first?'Create your password':'Change password')+'</h2><p class="muted">'+(first?esc(p.name)+', pick a password only you know. At least 4 characters.':'Enter your current password (or the master password), then the new one.')+'</p>'+
  (first?'':'<input id="old" type="password" autocomplete="current-password" placeholder="Current or master password">')+
  '<input id="n1" type="password" autocomplete="new-password" placeholder="New password"><input id="n2" type="password" autocomplete="new-password" placeholder="Type it again"><button class="btn" '+(S.busy?'disabled':'')+'>'+(S.busy?'Saving…':'Save password')+'</button>'+(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'<button type="button" class="link" data-a="back">← Back</button></form>';}
function sale(r,amt,label){return '<div class="sale"><b>'+esc(r.cust||'—')+'</b><span class="amt">'+money(amt)+'</span><span class="d">'+esc([r.date,r.svc].filter(Boolean).join(' · '))+(label?' · '+label:'')+'</span></div>';}
function vData(){var d=S.data,t=d.totals||{};
  var h='<h2>'+esc(d.name)+'</h2><div class="owed"><span class="k">Commission owed this pay period</span><span class="v">'+money(t.periodComm)+'</span><span class="s">on '+money(t.periodSales)+' in sales</span></div>'+
   '<div class="stats"><div class="stat"><span class="k">Sales this year</span><span class="v">'+money(t.ytdSales)+'</span></div><div class="stat"><span class="k">Commission this year</span><span class="v">'+money(t.ytdComm)+'</span></div></div>'+
   '<section class="card"><h2>This pay period</h2>'+(d.current.length?d.current.map(function(r){return sale(r,r.cur,'');}).join(''):'<p class="muted">No sales yet this pay period.</p>')+'</section>';
  if(d.past.length) h+='<details class="card"><summary><h2>Earlier sales ('+d.past.length+')</h2></summary>'+d.past.map(function(r){return sale(r,r.paid,'');}).join('')+'</details>';
  h+='<div class="foot"><span>Live from the '+esc(d.name)+' commission tracker sheet.</span><span><button class="link" data-a="chpw">Change password</button> · <button class="link" data-a="lock">Lock</button></span></div>';
  return h;}
function render(){var h=head();
  if(S.view==='pick') h+=vPick(); else if(S.view==='pw') h+=vPw(); else if(S.view==='set') h+=vSet(!person().hasPw); else if(S.view==='chpw') h+=vSet(false); else h+=vData();
  app.innerHTML=h; var f=app.querySelector('input'); if(f) f.focus();}
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.who){S.who=t.dataset.who;S.err='';var p=person();var saved=sg('comm.'+S.who);if(saved){S.pw=saved;open();return;}S.view=p.hasPw?'pw':'set';render();return;}
  if(t.dataset.a==='back'){S.err='';S.view=S.data&&S.view==='chpw'?'data':'pick';if(S.view==='pick'){S.data=null;}render();}
  if(t.dataset.a==='lock'){ss('comm.'+S.who,null);S.data=null;S.pw='';S.view='pick';render();}
  if(t.dataset.a==='chpw'){S.err='';S.view='chpw';render();}});
app.addEventListener('submit',function(e){e.preventDefault();var f=e.target;
  if(f.dataset.f==='open'){S.pw=(document.getElementById('pw').value||'');if(S.pw)open();return;}
  var n1=document.getElementById('n1').value,n2=document.getElementById('n2').value,old=document.getElementById('old');
  if(n1.length<4){S.err='Use at least 4 characters.';render();return;} if(n1!==n2){S.err='The two passwords don\'t match.';render();return;}
  S.busy=true;S.err='';render();
  api('commSetPw',[S.who,n1,old?old.value:'']).then(function(){S.busy=false;(S.list||[]).forEach(function(p){if(p.key===S.who)p.hasPw=true;});S.pw=n1;open();})
   .catch(function(x){S.busy=false;S.err=String(x.message||x);render();});});
render(); loadList();
})();
</script>
</body>
</html>
