<style>
:root{--bg:#f2f4ee;--surface:#fff;--sunk:#e8ece2;--ink:#111410;--muted:#596052;--line:#d6dccd;--accent:#89c43e;--accent-ink:#0b0d09;--accent-soft:#e7f3d6;--ok:#4a7a17;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
input[type=search]{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font:700 1.3rem/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:grid;gap:12px;max-width:420px}
.lock input{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:600 1.3rem var(--body);letter-spacing:.3em}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
.err{color:#b3261e;margin:0;font-weight:600}
.weekbar{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
.weekbar button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;cursor:pointer}
.weekbar button:disabled{opacity:.35}
.weekbar select{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font:600 1rem var(--body);text-align:center}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.stat.big{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat .k{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.stat.big .k{color:inherit;opacity:.75}
.stat .v{font:700 1.9rem/1.05 var(--display)}
.stat.big .v{font-size:2.6rem}
.chg{font-size:.85rem;font-weight:600;color:var(--muted)}
.chg.good{color:var(--ok)}.chg.bad{color:#b3261e}
.stat.big .chg{color:inherit;opacity:.85}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.bar .n{font-weight:600}.bar .a{font-weight:700;font-variant-numeric:tabular-nums}
.bar .t{grid-column:1/-1;height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar .c{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.row:first-child{border-top:0;padding-top:0}
.row .a{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.row .chg{display:block;text-align:right}
.muted{color:var(--muted);margin:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr.now td{font-weight:700;background:var(--accent-soft)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.foot button{background:none;border:0;color:var(--ok);font-weight:600;cursor:pointer;padding:0}

(function(){
var API_URL='https://script.google.com/macros/s/AKfycbxo4fckh7oI-qBhFa1qK_7597w_yS4p43mspjgEG7k0DzNAUEFPfAtTxGfDWJM3GNG6Xw/exec';
var app=document.getElementById('app'), S={pin:'',data:null,wk:'',err:'',busy:false};
try{ S.pin=localStorage.getItem('kpi.pin')||''; var c=JSON.parse(localStorage.getItem('kpi.data')||'null'); if(c&&S.pin) S.data=c; }catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(fn,args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Error');return j.data;});}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dt(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function wkLabel(k){var e=dt(k),s=new Date(e.getTime()-6*864e5);return MON[s.getMonth()]+' '+s.getDate()+' – '+MON[e.getMonth()]+' '+e.getDate()+(e.getFullYear()!==new Date().getFullYear()?', '+e.getFullYear():'');}
function isMoney(g,s){return /revenue/i.test(g.name)||/revenue/i.test(s.label);}
function lowGood(s,g){return /cancel|reservice|reschedule|standing/i.test(s.label+' '+g.name)||s.unit==='time';}
function nm(t){return String(t).replace(/^Oustanding/i,'Outstanding');}
function fmt(n,money,unit){if(n==null)return '—';if(money)return '$'+Math.round(n).toLocaleString();if(unit==='%')return (Math.round(n*10)/10)+'%';return (Math.round(n*10)/10).toLocaleString();}
function prevVal(s,k){var ks=Object.keys(s.pts).filter(function(x){return x<k;}).sort();return ks.length?s.pts[ks[ks.length-1]]:null;}
function chg(now,prev,money,unit,low){if(now==null||prev==null)return '';var d=now-prev;if(Math.abs(d)<1e-9)return '<span class="chg">Same as last week</span>';
  var good=low?d<0:d>0, txt=(d>0?'▲ ':'▼ ')+(unit==='%'?(Math.round(Math.abs(d)*10)/10)+' pts':money?'$'+Math.round(Math.abs(d)).toLocaleString():(prev?Math.round(Math.abs(d)/Math.abs(prev)*100)+'%':Math.round(Math.abs(d)*10)/10));
  return '<span class="chg '+(good?'good':'bad')+'">'+txt+' vs last week</span>';}
function load(){S.busy=true;S.err='';render();api('kpiData',[S.pin]).then(function(d){S.data=d;S.busy=false;try{localStorage.setItem('kpi.pin',S.pin);localStorage.setItem('kpi.data',JSON.stringify(d));}catch(e){}render();})
  .catch(function(e){S.busy=false;S.err=String(e.message||e);if(/pin/i.test(S.err)){S.data=null;try{localStorage.removeItem('kpi.pin');localStorage.removeItem('kpi.data');}catch(x){}}render();});}
function pickWeek(){var w=S.data.weeks,today=new Date(),best='';w.forEach(function(k){if(dt(k)<=new Date(today.getTime()+864e5))best=k;});return best||w[w.length-1];}
function lockView(){return '<form class="lock" id="f"><h2>Managers only</h2><p class="muted">Enter the manager PIN to see company numbers.</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button class="btn" '+(S.busy?'disabled':'')+'>'+(S.busy?'Checking…':'Unlock')+'</button>'+(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'</form>';}
function weekView(){var d=S.data,k=S.wk,ws=d.weeks,i=ws.indexOf(k),h='';
  h+='<div class="weekbar"><button id="prev" aria-label="Previous week" '+(i<=0?'disabled':'')+'>‹</button><select id="wk" aria-label="Week">'+ws.slice().reverse().map(function(x){return '<option value="'+x+'"'+(x===k?' selected':'')+'>'+wkLabel(x)+'</option>';}).join('')+'</select><button id="next" aria-label="Next week" '+(i>=ws.length-1?'disabled':'')+'>›</button></div>';
  var stats='', cards='';
  d.groups.forEach(function(g){
    var veh=/vehicle/i.test(g.name);
    var items=g.series.map(function(s){return {s:s,v:s.pts[k]!=null?s.pts[k]:null,p:prevVal(s,k),money:isMoney(g,s),low:lowGood(s,g)};});
    if(veh){var tot=0,ptot=0,has=false,phas=false;items.forEach(function(x){if(x.v!=null){tot+=x.v;has=true;}if(x.p!=null){ptot+=x.p;phas=true;}});
      var prevK=ws[i-1];ptot=0;phas=false;if(prevK)items.forEach(function(x){if(x.s.pts[prevK]!=null){ptot+=x.s.pts[prevK];phas=true;}});
      stats='<div class="stat big"><span class="k">Vehicle revenue this week</span><span class="v">'+(has?fmt(tot,true):'—')+'</span>'+(has&&phas?chg(tot,ptot,true,'',false):'')+'</div>'+stats;
      var live=items.filter(function(x){return x.v!=null;}).sort(function(a,b){return b.v-a.v;}),mx=Math.max.apply(null,live.map(function(x){return x.v;}).concat([1]));
      cards+='<section class="card"><h2>Revenue by vehicle</h2>'+(live.length?'<div class="bars">'+live.map(function(x){return '<div class="bar"><span class="n">'+esc(x.s.label)+'</span><span class="a">'+fmt(x.v,true)+'</span><span class="t"><i style="width:'+Math.max(2,x.v/mx*100)+'%"></i></span>'+(x.p!=null?'<span class="c">'+chg(x.v,x.p,true,'',false).replace(/<\/?span[^>]*>/g,'')+'</span>':'')+'</div>';}).join('')+'</div>':'<p class="muted">No vehicle numbers for this week.</p>')+'</section>';
      return;}
    var tech=g.series.some(function(s){return s.unit;});
    if(!tech){items.forEach(function(x){if(x.v==null)return;stats+='<div class="stat"><span class="k">'+esc(nm(x.s.label))+'</span><span class="v">'+fmt(x.v,x.money,x.s.unit)+'</span>'+chg(x.v,x.p,x.money,x.s.unit,x.low)+'</div>';});return;}
    var live2=items.filter(function(x){return x.v!=null;}); if(!live2.length) return;
    cards+='<section class="card"><h2>'+esc(g.name)+'</h2>'+(live2.length?'<div class="rows">'+live2.map(function(x){return '<div class="row"><span>'+esc(x.s.label)+'</span><span class="a">'+fmt(x.v,x.money,x.s.unit)+chg(x.v,x.p,x.money,x.s.unit,x.low)+'</span></div>';}).join('')+'</div>':'<p class="muted">No numbers for this week.</p>')+'</section>';
  });
  h+='<div class="stats">'+stats+'</div>'+cards;
  if(d.years&&d.years.rows.length){var cm=MON[dt(k).getMonth()];
    h+='<section class="card"><h2>Monthly revenue: '+esc(d.years.b)+' vs '+esc(d.years.a)+'</h2><table><thead><tr><th>Month</th><th>'+esc(d.years.a)+'</th><th>'+esc(d.years.b)+'</th><th>Change</th></tr></thead><tbody>'+
    d.years.rows.map(function(r){var p=(r.a&&r.b!=null)?Math.round((r.b-r.a)/r.a*100):null;return '<tr'+(r.month.slice(0,3)===cm?' class="now"':'')+'><td>'+esc(r.month)+'</td><td>'+fmt(r.a,true)+'</td><td>'+fmt(r.b,true)+'</td><td>'+(p==null?'—':(p>0?'+':'')+p+'%')+'</td></tr>';}).join('')+'</tbody></table></section>';}
  var up=new Date(d.updated);h+='<div class="foot"><span>Updated '+up.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'. Refreshes daily at 6am.</span><button id="lockbtn">Lock</button></div>';
  return h;}
function render(){var h='<a class="back" href="/">← All tools</a><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b style="text-transform:none">KPIs</b><span class="eyebrow">Weekly company numbers</span></div></div>';
  if(!S.data) h+=lockView(); else { if(!S.wk||S.data.weeks.indexOf(S.wk)<0) S.wk=pickWeek(); h+=weekView(); }
  app.innerHTML=h; var p=document.getElementById('pin'); if(p) p.focus();}
app.addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('pin');S.pin=(p&&p.value||'').trim();if(S.pin)load();});
app.addEventListener('change',function(e){if(e.target.id==='wk'){S.wk=e.target.value;render();}});
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var ws=S.data&&S.data.weeks,i=ws?ws.indexOf(S.wk):-1;
  if(t.id==='prev'&&i>0){S.wk=ws[i-1];render();} if(t.id==='next'&&i<ws.length-1){S.wk=ws[i+1];render();}
  if(t.id==='lockbtn'){S.data=null;S.pin='';try{localStorage.removeItem('kpi.pin');localStorage.removeItem('kpi.data');}catch(x){}render();}});
render(); if(S.pin&&S.data) load();
})();
</script>
