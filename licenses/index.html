<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f2f4ee;--surface:#fff;--sunk:#e8ece2;--ink:#111410;--muted:#596052;--line:#d6dccd;--accent:#89c43e;--accent-ink:#0b0d09;--accent-soft:#e7f3d6;--ok:#4a7a17;
--warn:#a96d12;--warn-soft:#f6e7cc;--crit:#b3261e;--crit-soft:#f6d9d6;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;
--warn:#e3a94c;--warn-soft:#3a2d15;--crit:#ef7d72;--crit-soft:#3d1c19;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:1000px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;background:var(--sunk);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 200px;width:auto}.bar select{width:auto;flex:0 1 auto}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 90px;min-width:0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.stat .v{font-family:var(--mono);font-size:1.6rem}
.stat.crit .v{color:var(--crit)}.stat.warn .v{color:var(--warn)}.stat.ok .v{color:var(--ok)}
.stat[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card h3{margin:0;padding:12px 16px;font:700 1.3rem/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.card h3 small{font:600 .8rem var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.lic{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.lic:first-of-type{border-top:0}
.st{font:700 1.05rem var(--display);width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);letter-spacing:.04em}
.lic .main b{font-weight:600}.lic .main div{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.lic .num{font-family:var(--mono);font-size:.88rem}
.pill{display:inline-block;align-self:center;justify-self:end;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;text-align:center}
.pill.ok{background:var(--accent-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.none{background:var(--sunk);color:var(--muted)}
.right{display:grid;gap:6px;justify-items:end}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.box p{margin:0;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.form .wide{grid-column:1/-1}
.pin{flex:1;display:grid;place-items:center}
.pin form{display:grid;gap:14px;width:min(100%,320px);text-align:center}
.pin input{text-align:center;font-family:var(--mono);font-size:1.8rem;letter-spacing:.4em}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.5rem;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
@media (max-width:520px){.lic{grid-template-columns:auto 1fr}.lic .right{grid-column:1/-1;justify-items:start;grid-auto-flow:column;justify-content:space-between}}
</style>
</head>

var BRANCHES=['Idaho Falls','Wyoming','Bozeman'];
var STATES=[['ID','Idaho'],['WY','Wyoming'],['MT','Montana'],['UT','Utah'],['OTHER','Other']];
var app=document.getElementById('app');
var S={view:'pin',pin:null,busy:false,d:null,tab:'list',q:'',branch:'all',filter:'all',edit:null,confirm:null};
function api(fn){ var args=[].slice.call(arguments,1);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){ if(!r.ok) throw new Error('Server error '+r.status); return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'Something went wrong.'); return j.data; })
    .catch(function(e){ throw (e instanceof TypeError ? new Error('No connection. Check Wi-Fi or data.') : e); }); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function msg(e){ return (e&&e.message?e.message:String(e)).replace(/^Exception:\s*/,''); }
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(function(){el.hidden=true;},3000); }
function soonDays(){ var m=String(S.d&&S.d.days||'60').split(',').map(Number); return Math.max.apply(null,m.concat([30])); }
function status(r){ if(r.days===null||r.days===undefined||r.expires==='') return 'none'; if(r.days<0) return 'crit'; if(r.days<=soonDays()) return 'warn'; return 'ok'; }
function pillText(r){ var s=status(r); if(s==='none') return 'No date';
  if(r.days<0) return 'Expired '+(-r.days)+'d ago'; if(r.days===0) return 'Expires today'; if(s==='warn') return r.days+' days left'; return 'Valid'; }
function fmtDate(s){ if(!s) return '—'; var p=s.split('-'); return +p[1]+'/'+(+p[2])+'/'+p[0]; }
function header(right){ return '<a class="back" href="/">← All tools</a><div class="top"><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Licenses</b><span class="eyebrow">Applicator licenses &amp; renewals</span></div></div>'+(right||'')+'</div>'; }

function vPin(){
  return header('')+'<div class="pin"><form id="pinForm"><span class="eyebrow">Manager PIN</span><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">'+
    '<button class="btn primary" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Checking…':'Unlock')+'</button><p class="eyebrow" style="text-transform:none;letter-spacing:0">License numbers are private, so this tool is locked.</p></form></div>';
}
function vMain(){
  var tabs='<div class="tabs" role="tablist">'+[['list','Licenses'],['add',S.edit?'Edit license':'Add license'],['settings','Reminders']].map(function(t){
    return '<button class="tab" role="tab" aria-selected="'+(S.tab===t[0])+'" data-a="tab" data-t="'+t[0]+'">'+t[1]+'</button>'; }).join('')+'</div>';
  return header('<button class="btn ghost sm" data-a="lock">Lock</button>')+tabs+({list:vList,add:vForm,settings:vSettings})[S.tab]();
}
function vList(){
  var rows=S.d.rows, q=S.q.toLowerCase();
  var c={crit:0,warn:0,ok:0,none:0}; rows.forEach(function(r){ c[status(r)]++; });
  var f=rows.filter(function(r){ return (S.branch==='all'||r.branch===S.branch) && (S.filter==='all'||status(r)===S.filter) &&
    (!q||[r.tech,r.state,r.type,r.number,r.notes].join(' ').toLowerCase().indexOf(q)>=0); });
  var by={},order=[]; f.sort(function(a,b){ return a.tech.localeCompare(b.tech)||((a.days==null?99999:a.days)-(b.days==null?99999:b.days)); })
    .forEach(function(r){ if(!by[r.tech]){ by[r.tech]=[]; order.push(r.tech); } by[r.tech].push(r); });
  var stats='<div class="stats">'+[['crit','Expired'],['warn','Due soon'],['ok','Valid']].map(function(s){
    return '<button class="stat '+s[0]+'" data-a="filter" data-f="'+s[0]+'" aria-pressed="'+(S.filter===s[0])+'"><div class="v">'+c[s[0]]+'</div><span class="eyebrow">'+s[1]+'</span></button>'; }).join('')+'</div>';
  var bar='<div class="bar"><input type="search" id="q" placeholder="Search tech, state, license #" value="'+esc(S.q)+'">'+
    '<select id="br" aria-label="Branch"><option value="all">All branches</option>'+BRANCHES.map(function(b){ return '<option'+(S.branch===b?' selected':'')+'>'+b+'</option>'; }).join('')+'</select>'+
    (S.filter!=='all'?'<button class="btn sm" data-a="filter" data-f="all">Show all</button>':'')+'</div>';
  var list=order.map(function(t){ var rs=by[t];
    return '<section class="card"><h3>'+esc(t)+'<small>'+esc(rs[0].branch||'')+'</small></h3>'+rs.map(function(r){ var s=status(r);
      return '<div class="lic"><div class="st">'+esc(r.state||'?')+'</div><div class="main"><b>'+esc(r.type||'Applicator license')+'</b>'+
        '<div>'+(r.number?'<span class="num">#'+esc(r.number)+'</span> · ':'')+'Expires '+fmtDate(r.expires)+(r.notes?' · '+esc(r.notes):'')+'</div></div>'+
        '<div class="right"><span class="pill '+s+'">'+pillText(r)+'</span>'+
        (S.confirm===r.id?'<span class="bar"><button class="btn danger sm" data-a="del" data-id="'+r.id+'">Delete</button><button class="btn sm" data-a="noconf">Keep</button></span>':
        '<span class="bar"><button class="btn sm" data-a="edit" data-id="'+r.id+'">Edit</button><button class="btn ghost sm" data-a="conf" data-id="'+r.id+'">Remove</button></span>')+'</div></div>';
    }).join('')+'</section>'; }).join('');
  if(!rows.length) list='<div class="empty"><b>No licenses yet</b>Tap “Add license” to enter the first one.</div>';
  else if(!f.length) list='<div class="empty">No licenses match.</div>';
  return stats+bar+'<div style="display:grid;gap:14px">'+list+'</div>'+
    (S.d.sheetUrl?'<p class="eyebrow" style="text-transform:none;letter-spacing:0">Everything is also in the <a href="'+esc(S.d.sheetUrl)+'" target="_blank" rel="noopener">Licenses tab of your Google Sheet</a>.</p>':'');
}
function vForm(){
  var r=S.edit||{tech:'',branch:'',state:'ID',type:'',number:'',expires:'',email:'',notes:''};
  var techs=S.d.techs.map(function(t){ return '<option value="'+esc(t.name)+'">'+esc(t.branch)+'</option>'; }).join('');
  var st=STATES.some(function(s){return s[0]===r.state;})?r.state:(r.state?'OTHER':'ID');
  return '<form class="box" id="licForm"><div class="form">'+
    '<label>Tech name<input name="tech" list="techList" required value="'+esc(r.tech)+'" autocomplete="off"></label><datalist id="techList">'+techs+'</datalist>'+
    '<label>Branch<select name="branch"><option value="">—</option>'+BRANCHES.map(function(b){ return '<option'+(r.branch===b?' selected':'')+'>'+b+'</option>'; }).join('')+'</select></label>'+
    '<label>State<select name="state">'+STATES.map(function(s){ return '<option value="'+s[0]+'"'+(st===s[0]?' selected':'')+'>'+s[1]+'</option>'; }).join('')+'</select></label>'+
    '<label id="otherWrap"'+(st==='OTHER'?'':' hidden')+'>State (2 letters)<input name="stateOther" maxlength="2" value="'+(st==='OTHER'?esc(r.state):'')+'"></label>'+
    '<label>License type<input name="type" list="typeList" placeholder="e.g. Commercial Applicator" value="'+esc(r.type)+'"></label>'+
    '<datalist id="typeList"><option>Commercial Applicator</option><option>Professional Applicator</option><option>Operator</option><option>Technician / Registered Tech</option><option>Structural Pest Control</option><option>Restricted Use (RUP)</option></datalist>'+
    '<label>License #<input name="number" value="'+esc(r.number)+'" autocomplete="off"></label>'+
    '<label>Expiration date<input name="expires" type="date" value="'+esc(r.expires)+'"></label>'+
    '<label>Tech email (optional)<input name="email" type="email" value="'+esc(r.email)+'" placeholder="Also remind the tech"></label>'+
    '<label class="wide">Notes (categories, CEUs needed, etc.)<input name="notes" value="'+esc(r.notes)+'"></label>'+
    '</div><div class="bar" style="justify-content:flex-end">'+(S.edit?'<button class="btn" type="button" data-a="cancelEdit">Cancel</button>':'')+
    '<button class="btn primary" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Saving…':(S.edit?'Save changes':'Add license'))+'</button></div></form>';
}
function vSettings(){
  return '<div class="box"><h3 style="margin:0;font:700 1.3rem var(--display);text-transform:uppercase">Reminder emails</h3>'+
    '<p>Every morning at 7am the system checks expiration dates. When a license hits one of the reminder points below, it emails the address here (and the tech, if their email is on the license). Each reminder point is sent once per license.</p>'+
    '<form id="setForm" class="form"><label>Send reminders to<input name="email" type="email" value="'+esc(S.d.email)+'"></label>'+
    '<label>Days before expiration<input name="days" value="'+esc(String(S.d.days).replace(/,/g,', '))+'" placeholder="60, 30, 14, 7, 0"></label>'+
    '<label>New PIN for this tool (optional)<input name="newPin" inputmode="numeric" maxlength="8" placeholder="Leave blank to keep"></label>'+
    '<div class="wide bar" style="justify-content:flex-end"><button class="btn" type="button" data-a="test">Send test email now</button><button class="btn primary" type="submit">Save</button></div></form></div>';
}
function render(){ app.innerHTML=S.view==='pin'?vPin():vMain(); if(S.view==='pin'){ var p=document.getElementById('pinIn'); if(p) p.focus(); } }
function apply(d){ S.d=d; }

app.addEventListener('submit',function(e){
  e.preventDefault(); var f=e.target;
  if(f.id==='pinForm'){ var pin=document.getElementById('pinIn').value; if(!pin) return; S.busy=true; render();
    api('licUnlock',pin).then(function(d){ S.busy=false; S.pin=pin; apply(d); S.view='main'; render(); }).catch(function(err){ S.busy=false; render(); toast(msg(err)); }); }
  else if(f.id==='licForm'){ var fd=new FormData(f), r={};
    fd.forEach(function(v,k){ r[k]=v; }); if(r.state==='OTHER') r.state=(r.stateOther||'').toUpperCase(); delete r.stateOther;
    if(S.edit) r.id=S.edit.id;
    if(!r.branch){ var t=S.d.techs.filter(function(x){return x.name.toLowerCase()===r.tech.trim().toLowerCase();})[0]; if(t) r.branch=t.branch; }
    S.busy=true; render();
    api('licSave',S.pin,r).then(function(d){ S.busy=false; apply(d); var was=!!S.edit; S.edit=null; S.tab='list'; render(); toast(was?'License updated.':'License added.'); })
      .catch(function(err){ S.busy=false; render(); toast(msg(err)); }); }
  else if(f.id==='setForm'){ var g=new FormData(f);
    api('licSettings',S.pin,g.get('email'),g.get('days'),g.get('newPin')||'').then(function(d){ if(g.get('newPin')) S.pin=g.get('newPin'); apply(d); render(); toast('Reminder settings saved.'); })
      .catch(function(err){ toast(msg(err)); }); }
});
app.addEventListener('input',function(e){
  if(e.target.id==='q'){ S.q=e.target.value; var pos=e.target.selectionStart; render(); var n=document.getElementById('q'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }
});
app.addEventListener('change',function(e){
  if(e.target.id==='br'){ S.branch=e.target.value; render(); }
  if(e.target.name==='state'){ document.getElementById('otherWrap').hidden=e.target.value!=='OTHER'; }
  if(e.target.name==='tech'){ var t=S.d.techs.filter(function(x){return x.name.toLowerCase()===e.target.value.trim().toLowerCase();})[0];
    var b=e.target.form.querySelector('[name=branch]'); if(t&&b&&!b.value) b.value=t.branch; }
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return; var a=b.getAttribute('data-a'), id=b.getAttribute('data-id');
  if(a==='tab'){ S.tab=b.getAttribute('data-t'); if(S.tab!=='add') S.edit=null; S.confirm=null; render(); }
  else if(a==='lock'){ S.pin=null; S.d=null; S.view='pin'; S.edit=null; render(); }
  else if(a==='filter'){ var f=b.getAttribute('data-f'); S.filter=(S.filter===f?'all':f); render(); }
  else if(a==='edit'){ S.edit=Object.assign({},S.d.rows.filter(function(r){return r.id===id;})[0]); S.tab='add'; render(); window.scrollTo(0,0); }
  else if(a==='cancelEdit'){ S.edit=null; S.tab='list'; render(); }
  else if(a==='conf'){ S.confirm=id; render(); }
  else if(a==='noconf'){ S.confirm=null; render(); }
  else if(a==='del'){ api('licDelete',S.pin,id).then(function(d){ apply(d); S.confirm=null; render(); toast('License removed.'); }).catch(function(err){ toast(msg(err)); }); }
  else if(a==='test'){ toast('Sending…'); api('licTest',S.pin).then(function(r){ toast(r.sent?'Test email sent ('+r.sent+' license'+(r.sent===1?'':'s')+').':r.note); }).catch(function(err){ toast(msg(err)); }); }
});
var idle; function resetIdle(){ clearTimeout(idle); idle=setTimeout(function(){ if(S.view!=='pin'){ S.pin=null; S.d=null; S.view='pin'; S.edit=null; render(); } }, 600000); }
['click','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev,resetIdle,{passive:true}); });
render();
})();
</script>
</body>
