<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f2f4ee;--surface:#fff;--sunk:#e8ece2;--ink:#111410;--muted:#596052;--line:#d6dccd;--accent:#89c43e;--accent-ink:#0b0d09;--accent-soft:#e7f3d6;--ok:#4a7a17;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
input[type=search]{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1{font:700 2rem/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font:700 1.3rem/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
h3{font:700 1.08rem/1.25 var(--body);margin:14px 0 4px}
a{color:var(--ok)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.err{color:#b3261e;font-weight:600;margin:0}
.ok{color:var(--ok);font-weight:600;margin:0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.link{background:none;border:0;color:var(--ok);font-weight:600;cursor:pointer;padding:0}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:grid;gap:12px;max-width:440px}
.lock input{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:600 1.2rem var(--body)}
input[type=search]{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px}
.start{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.start h2 a{color:inherit;text-decoration:none}
.chap{margin:4px 0 0;padding-left:22px;columns:2 220px;column-gap:24px}
.chap li{margin:0 0 6px;break-inside:avoid}
.chap a{color:var(--ink);text-decoration:none;font-weight:500}
.lib{margin-top:6px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;text-decoration:none;color:var(--ink);min-height:84px;align-content:start}
.doc b{font-weight:700;line-height:1.25}
.doc span{font-size:.85rem;color:var(--muted)}
.hits{display:grid;gap:8px}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.hit .where{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hit .snip{font-size:.95rem}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tools select{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font:inherit;color:inherit}
.intro{display:grid;gap:4px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.sec>summary{cursor:pointer;list-style:none;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font:700 1.15rem/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-size:1.4rem;color:var(--muted);flex:none}
details.sec[open]>summary::after{content:"–"}
details.sec .body{padding:0 16px 16px}
ul,ol{margin:0 0 10px;padding-left:22px}
li{margin:0 0 6px}
.say{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0 0 10px;display:grid;gap:8px}
.say p{margin:0;font-style:italic}
.copy{justify-self:start;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink)}
.note{border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 10px 10px 0;padding:10px 12px;margin:0 0 10px}
.note.warn{border-left-color:#b3261e}
.note.warn b{color:#b3261e}
details.qa{border:1px solid var(--line);border-radius:12px;margin:0 0 8px;background:var(--bg)}
details.qa summary{cursor:pointer;padding:12px 14px;font-weight:600}
details.qa p{padding:0 14px 12px;margin:0}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:2px 10px;margin:0}
.steps li::before{content:counter(s);grid-row:span 2;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 1.2rem var(--display)}
.steps li span{color:var(--muted)}
.never{list-style:none;padding:0}
.never li{padding-left:26px;position:relative;color:#b3261e;font-weight:600}
.never li::before{content:"✕";position:absolute;left:4px}
.check{list-style:none;padding:0}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ok)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.tw{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{background:var(--ink);color:var(--bg);text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;min-width:120px}
td:first-child{font-weight:600}
.flash{animation:fl 1.8s ease}
@keyframes fl{0%,40%{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:none}}
.pn{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:.92rem}
.pn a{text-decoration:none;max-width:48%}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.imp .file{position:relative;overflow:hidden;justify-self:start}
.imp .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>

<script>

(function(){
var API_URL='https://script.google.com/macros/s/AKfycbxo4fckh7oI-qBhFa1qK_7597w_yS4p43mspjgEG7k0DzNAUEFPfAtTxGfDWJM3GNG6Xw/exec';
var app=document.getElementById('app'), S={pin:'',data:null,updated:null,err:'',busy:false,q:'',doc:-1,open:{},msg:'',canEdit:false};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
try{S.pin=ls('man.pin')||'';var c=ls('man.data');if(c&&S.pin){var o=JSON.parse(c);S.data=o.d;S.updated=o.u;S.canEdit=!!o.c;}}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rich(s){return esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function api(fn,args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Error');return j.data;});}
function save(){try{ls('man.pin',S.pin);ls('man.data',JSON.stringify({d:S.data,u:S.updated,c:S.canEdit}));}catch(e){}}
function load(){S.busy=true;S.err='';render();api('manualData',[S.pin]).then(function(r){S.busy=false;S.updated=r.updated;S.canEdit=!!r.canEdit;S.data=r.json?JSON.parse(r.json):{docs:[]};save();render();})
  .catch(function(e){S.busy=false;S.err=String(e.message||e);if(/pin|password/i.test(S.err)){S.data=null;ls('man.pin',null);ls('man.data',null);}render();});}
function docs(){return (S.data&&S.data.docs)||[];}
function short(t){return String(t).replace(/^Standard Operating Procedure:\s*/,'').replace(/\s+—\s+Handling Guide$/,'');}
/* split a doc into sections at each h2 */
function sections(d){var out=[],cur={h:null,b:[],i0:0};d.blocks.forEach(function(b,i){if(b.t==='title')return;if(b.t==='h2'){if(cur.h||cur.b.length)out.push(cur);cur={h:b.x,b:[],i0:i};}else cur.b.push([b,i]);});if(cur.h||cur.b.length)out.push(cur);return out;}
function blockText(b){return [b.x,b.q,b.a,b.label].concat(b.items||[]).concat(b.head||[]).concat([].concat.apply([],b.rows||[])).filter(Boolean).join(' ');}
function block(b,di,bi){var id='b'+di+'-'+bi;
  if(b.t==='p')return '<p id="'+id+'">'+rich(b.x)+'</p>';
  if(b.t==='muted')return '<p class="muted" id="'+id+'">'+rich(b.x)+'</p>';
  if(b.t==='h3')return '<h3 id="'+id+'">'+esc(b.x)+'</h3>';
  if(b.t==='quote')return '<div class="say" id="'+id+'"><p>'+rich(b.x)+'</p><button class="copy" data-copy="'+di+'-'+bi+'">Copy</button></div>';
  if(b.t==='note')return '<div class="note" id="'+id+'"><b>'+esc(b.label||'Note')+'</b> '+rich(b.x)+'</div>';
  if(b.t==='warn')return '<div class="note warn" id="'+id+'"><b>'+esc(b.label||'Never')+'</b> '+rich(b.x)+'</div>';
  if(b.t==='qa')return '<details class="qa" id="'+id+'"><summary>'+esc(b.q)+'</summary><p>'+rich(b.a)+'</p></details>';
  if(b.t==='ul')return '<ul id="'+id+'">'+b.items.map(function(x){return '<li>'+rich(x)+'</li>';}).join('')+'</ul>';
  if(b.t==='ol')return '<ol class="steps" id="'+id+'">'+b.items.map(function(x){var m=/^(.+?) — (.*)$/.exec(x);return '<li>'+(m?'<b>'+esc(m[1])+'</b><span>'+rich(m[2])+'</span>':rich(x))+'</li>';}).join('')+'</ol>';
  if(b.t==='never')return '<ul class="never" id="'+id+'">'+b.items.map(function(x){return '<li>'+rich(x)+'</li>';}).join('')+'</ul>';
  if(b.t==='check')return '<ul class="check" id="'+id+'">'+b.items.map(function(x,i){var k='man.chk.'+di+'.'+bi+'.'+i,on=ls(k)==='1';return '<li><label><input type="checkbox" data-k="'+k+'"'+(on?' checked':'')+'><span>'+rich(x)+'</span></label></li>';}).join('')+'</ul>';
  if(b.t==='table'){var h=b.head;return '<div class="tw" id="'+id+'"><table>'+(h?'<thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead>':'')+'<tbody>'+b.rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+rich(x)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';}
  return '';}
function head(sub){return '<a class="back" href="'+(S.doc>=0?'#':'/')+'">'+(S.doc>=0?'← CSR Manual':'← All tools')+'</a><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>CSR Manual</b><span class="eyebrow">'+esc(sub||'Scripts, pricing and how we do things')+'</span></div></div>';}
function lockView(){return head()+'<form class="lock" data-f="pin"><h2>CSR team</h2><p class="muted">Enter the CSR password to open the manual. Managers can use the manager PIN.</p><input id="pin" type="password" autocomplete="current-password" placeholder="Password"><button class="btn" '+(S.busy?'disabled':'')+'>'+(S.busy?'Checking…':'Unlock')+'</button>'+(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'</form>';}
function importView(first){return '<section class="card imp"><h2>'+(first?'Load the manual':'Update the manual')+'</h2><p class="muted">'+(first?'The manual has not been loaded yet. ':'')+'Pick the <b>csr-manual.json</b> file. It replaces what is here now.</p><label class="btn file">Choose file<input type="file" id="file" accept=".json,application/json"></label>'+(S.msg?'<p class="ok">'+esc(S.msg)+'</p>':'')+(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'</section>';}
var QUICK=[['Retention card',/Retention Quick Reference/],['Pricing & FAQs',/Customer Service SOP/],['Escalation',/Escalation/],['Welcome call',/Welcome Call/],['Cold calls',/Inside Sales/]];
function homeView(){var D=docs(),h=head();
  if(!D.length) return h+(S.canEdit?importView(true):'<p class="muted">The manual hasn’t been loaded yet. Ask a manager.</p>')+foot();
  h+='<input type="search" id="q" placeholder="Search the manual — try “too expensive” or “bed bug”" value="'+esc(S.q)+'" autocomplete="off">';
  if(S.q.trim().length>=2) return h+results()+foot();
  h+='<div class="chips">'+QUICK.map(function(q){var i=-1;D.forEach(function(d,j){if(i<0&&q[1].test(d.title))i=j;});return i<0?'':'<a class="chip" href="#d'+i+'">'+esc(q[0])+'</a>';}).join('')+'</div>';
  var p1=D.filter(function(d){return d.part==='part1';}),ref=D.map(function(d,i){return [d,i];}).filter(function(x){return x[0].part!=='part1';});
  p1.forEach(function(d){var i=D.indexOf(d),ss=sections(d);
    h+='<section class="card start"><span class="eyebrow">Start here</span><h2><a href="#d'+i+'">'+esc(short(d.title))+'</a></h2><p class="muted">Read this first. It covers both CSR roles.</p><ol class="chap">'+ss.map(function(s,k){return s.h?'<li><a href="#d'+i+'-s'+k+'">'+esc(s.h.replace(/^Chapter \d+:\s*/,''))+'</a></li>':'';}).join('')+'</ol></section>';});
  h+='<h2 class="lib">Reference library</h2><div class="docs">'+ref.map(function(x){var d=x[0],n=sections(d).filter(function(s){return s.h;}).length;
    return '<a class="doc" href="#d'+x[1]+'"><b>'+esc(short(d.title))+'</b><span>'+(d.sub?esc(d.sub):(n?n+' sections':'Quick sheet'))+'</span></a>';}).join('')+'</div>';
  return h+foot();}
function foot(){return '<div class="foot"><span>'+(S.updated?'Loaded '+new Date(S.updated).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'}):'')+'</span><span>'+(S.canEdit?'<button class="link" data-a="imp">Update manual</button> · ':'')+'<button class="link" data-a="lock">Lock</button></span></div>'+(S.imp&&S.canEdit?importView(false):'');}
function results(){var q=S.q.trim().toLowerCase(),words=q.split(/\s+/),out=[];
  docs().forEach(function(d,di){var sec=null,sk=-1;d.blocks.forEach(function(b,bi){if(b.t==='h2'){sec=b.x;sk++;}var t=blockText(b),tl=t.toLowerCase();
    if(words.every(function(w){return tl.indexOf(w)>=0;})&&out.length<80){var at=tl.indexOf(words[0]),st=Math.max(0,at-60),snip=(st?'…':'')+t.slice(st,st+180)+(t.length>st+180?'…':'');
      out.push('<a class="hit" href="#d'+di+'-b'+bi+'"><span class="where">'+esc(short(d.title))+(sec&&b.t!=='h2'?' · '+esc(sec):'')+'</span><span class="snip">'+mark(snip,words)+'</span></a>');}});});
  return '<p class="muted">'+(out.length?out.length+(out.length>=80?'+':'')+' matches':'No matches. Try fewer or different words.')+'</p><div class="hits">'+out.join('')+'</div>';}
function mark(s,words){var h=esc(s);words.forEach(function(w){if(!w)return;var e=esc(w).replace(/[.*+?^()|[\]\\{}$]/g,'\\$&');h=h.replace(new RegExp('('+e+')','ig'),'<mark>$1</mark>');});return h;}
function docView(){var di=S.doc,d=docs()[di];if(!d){S.doc=-1;return homeView();}
  var ss=sections(d),many=ss.filter(function(s){return s.h;}).length>2&&!/Quick Reference Card/.test(d.title),h=head(d.part==='part1'?'Quick-Start Guide':'Reference library');
  h+='<h1>'+esc(short(d.title))+'</h1>';
  if(many) h+='<div class="tools"><select id="jump" aria-label="Jump to section"><option value="">Jump to a section…</option>'+ss.map(function(s,k){return s.h?'<option value="'+k+'">'+esc(s.h)+'</option>':'';}).join('')+'</select><button class="link" data-a="all">'+(S.allOpen?'Collapse all':'Expand all')+'</button></div>';
  ss.forEach(function(s,k){var body=s.b.map(function(x){return block(x[0],di,x[1]);}).join('');
    if(!s.h){h+='<div class="intro">'+body+'</div>';return;}
    var op=!many||S.allOpen||S.open[di+'-'+k];
    h+='<details class="sec" id="s'+di+'-'+k+'" data-k="'+di+'-'+k+'"'+(op?' open':'')+'><summary id="b'+di+'-'+s.i0+'">'+esc(s.h)+'</summary><div class="body">'+body+'</div></details>';});
  var prev=di>0?'<a href="#d'+(di-1)+'">‹ '+esc(short(docs()[di-1].title))+'</a>':'<span></span>',next=di<docs().length-1?'<a href="#d'+(di+1)+'">'+esc(short(docs()[di+1].title))+' ›</a>':'<span></span>';
  return h+'<nav class="pn">'+prev+next+'</nav>';}
function render(){var h;if(!S.data)h=lockView();else if(S.doc>=0)h=docView();else h=homeView();app.innerHTML=h;
  var p=document.getElementById('pin');if(p)p.focus();}
function route(){var m=/^#d(\d+)(?:-(s|b)(\d+))?$/.exec(location.hash);S.doc=m?+m[1]:-1;var target=null;
  if(m&&m[2]==='s'){S.open[m[1]+'-'+m[3]]=1;target='s'+m[1]+'-'+m[3];}
  if(m&&m[2]==='b'){var d=docs()[S.doc];if(d){var ss=sections(d);ss.forEach(function(s,k){if(s.i0==+m[3]||s.b.some(function(x){return x[1]==+m[3];}))S.open[m[1]+'-'+k]=1;});}target='b'+m[1]+'-'+m[3];}
  render();
  if(target){var el=document.getElementById(target);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(function(){el.classList.remove('flash');},1800);}}
  else window.scrollTo(0,0);}
app.addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('pin');S.pin=(p&&p.value||'').trim();if(S.pin)load();});
app.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(x){}}});
app.addEventListener('change',function(e){var t=e.target;
  if(t.id==='jump'&&t.value!==''){location.hash='#d'+S.doc+'-s'+t.value;}
  if(t.dataset&&t.dataset.k&&t.type==='checkbox')ls(t.dataset.k,t.checked?'1':null);
  if(t.id==='file'&&t.files&&t.files[0]){S.err='';S.msg='Uploading…';render();t.files[0].text().then(function(txt){var d=JSON.parse(txt);if(!d||!d.docs)throw new Error('That is not a CSR manual file.');
    return api('manualSave',[S.pin,txt]).then(function(r){S.data=d;S.updated=r.updated;S.msg='Loaded '+r.docs+' documents.';S.imp=false;save();render();});})
    .catch(function(x){S.msg='';S.err=String(x.message||x);render();});}});
app.addEventListener('toggle',function(e){var t=e.target;if(t.classList&&t.classList.contains('sec'))S.open[t.dataset.k]=t.open?1:0;},true);
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.copy){var p=t.dataset.copy.split('-'),b=docs()[+p[0]].blocks[+p[1]],txt=String(b.x).replace(/^["“]|["”]$/g,'');
    var done=function(){t.textContent='Copied';setTimeout(function(){t.textContent='Copy';},1500);};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,function(){});else done();}
  if(t.dataset.a==='all'){S.allOpen=!S.allOpen;if(!S.allOpen)S.open={};render();}
  if(t.dataset.a==='imp'){S.imp=!S.imp;S.msg='';S.err='';render();}
  if(t.dataset.a==='lock'){S.data=null;S.pin='';ls('man.pin',null);ls('man.data',null);location.hash='';render();}});
window.addEventListener('hashchange',route);
route(); if(S.pin&&S.data) load();
})();
</script>
