<style>
:root{
  --bg:#f2f4ee; --surface:#ffffff; --sunk:#e8ece2; --ink:#111410; --muted:#596052; --line:#d6dccd;
  --accent:#89c43e; --accent-ink:#0b0d09; --accent-soft:#e7f3d6; --ok:#4a7a17; --crit:#b3261e; --crit-soft:#f6d9d6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e100c; --surface:#181b15; --sunk:#0a0b08; --ink:#eef2ea; --muted:#9ba393; --line:#2a2f25;
  --accent:#8cc63f; --accent-soft:#25331a; --ok:#9fd65a; --crit:#ef7d72; --crit-soft:#3d1c19; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topbar{display:flex;flex-direction:column;gap:10px;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.row1{display:flex;align-items:center;gap:12px}
.back{font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ok);white-space:nowrap}
h1{font:700 1.5rem/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
form.search{display:flex;gap:8px}
form.search input{flex:1;min-width:0;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.results{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;max-height:40vh;overflow:auto}
.results button{text-align:left;padding:10px;border-radius:8px;font-size:.95rem}
.results button:hover{background:var(--sunk)}
#map{flex:1;min-height:200px;background:#1b1f18}
.leaflet-container{font:inherit}
.panel{background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:10px;max-height:45vh;overflow:auto;z-index:2}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.total .v{font:700 2rem/1 var(--display);letter-spacing:.02em}
.total .s{color:var(--muted);font-size:.9rem}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.areas{display:grid;gap:6px}
.area{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.sw{width:14px;height:14px;border-radius:4px}
.area input{border:0;background:transparent;padding:4px 0;min-width:0;font-weight:600;font-size:16px}
.area .n{font-family:var(--mono);font-size:.9rem;white-space:nowrap}
.area.sub .n{color:var(--crit)}
.tog{font-size:.78rem;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ok)}
.area.sub .tog{background:var(--crit-soft);color:var(--crit)}
.x{width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:1.2rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:.92rem;color:var(--muted);margin:0}
.drawing{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:600}
.layers{position:absolute;top:10px;right:10px;z-index:500;display:flex;border-radius:10px;overflow:hidden;border:1px solid rgba(0,0,0,.3);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.layers button{background:#fff;color:#111;padding:8px 10px;font-size:.82rem;font-weight:600}
.layers button[aria-pressed="true"]{background:#111;color:#fff}
.gm{position:absolute;left:10px;bottom:5px;z-index:500;line-height:0;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:1000;font-weight:600;max-width:calc(100% - 32px)}
.vx{width:18px!important;height:18px!important;margin:-9px 0 0 -9px!important;border-radius:50%;background:#fff;border:3px solid #111;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.vx.first{background:#ffd23f}
.lbl{background:rgba(17,20,16,.85);color:#fff;border:0;border-radius:6px;padding:2px 6px;font:600 12px var(--body);box-shadow:none;white-space:nowrap}
.lbl:before{display:none}
</style>

function startDraw(line){ if(line) nL++; else n++; var color=COLORS[(n+nL-1)%COLORS.length];
  draw={name:line?'Line '+nL:'Area '+n,line:!!line,color:color,sub:false,pts:[],markers:[],shape:(line?L.polyline([],{color:color,weight:4,interactive:false}):L.polygon([],{color:color,weight:3,fillOpacity:.25,interactive:false})).addTo(map)};
  map.doubleClickZoom.disable(); areas.forEach(function(a){ a.shape.setStyle({opacity:.6}); }); render(); }
function vIcon(first){ return L.divIcon({className:'vx'+(first?' first':''),iconSize:null}); }
map.on('click',function(e){ if(!draw) return; addPt(e.latlng); });
function addPt(ll){ var i=draw.pts.length; draw.pts.push(ll);
  var m=L.marker(ll,{icon:vIcon(i===0),draggable:true,keyboard:false}).addTo(map);
  m.on('drag',function(){ draw.pts[draw.markers.indexOf(m)]=m.getLatLng(); redraw(); });
  m.on('click',function(){ if(draw&&!draw.line&&draw.markers.indexOf(m)===0&&draw.pts.length>=3) finish(); });
  draw.markers.push(m); redraw(); }
function redraw(){ if(!draw) return; draw.shape.setLatLngs(draw.pts); render(); }
function undo(){ if(!draw||!draw.pts.length) return; draw.pts.pop(); map.removeLayer(draw.markers.pop()); redraw(); }
function cancel(){ if(!draw) return; draw.markers.forEach(function(m){ map.removeLayer(m); }); map.removeLayer(draw.shape); if(draw.line) nL--; else n--; draw=null; map.doubleClickZoom.enable(); restyle(); render(); }
function finish(){ if(!draw||draw.pts.length<(draw.line?2:3)) return; draw.markers.forEach(function(m){ map.removeLayer(m); });
  var a={name:draw.name,line:draw.line,color:draw.color,sub:false,pts:draw.pts.slice(),shape:draw.shape};
  a.shape.setStyle({interactive:false}); areas.push(a); draw=null; map.doubleClickZoom.enable(); restyle(); render(); }
function restyle(){ labels.clearLayers();
  areas.forEach(function(a){ if(a.line){ a.shape.setStyle({color:a.color,opacity:1});
      labels.addLayer(L.tooltip({permanent:true,direction:'center',className:'lbl',interactive:false}).setLatLng(a.shape.getCenter()).setContent(len(perimM(a.pts,false)*FT))); return; }
    a.shape.setStyle({color:a.sub?'#e53935':a.color,opacity:1,fillOpacity:a.sub?.35:.25,dashArray:a.sub?'6 6':null});
    labels.addLayer(L.tooltip({permanent:true,direction:'center',className:'lbl',interactive:false}).setLatLng(a.shape.getBounds().getCenter()).setContent((a.sub?'−':'')+fmt(areaM2(a.pts)*SQFT)+' sq ft')); }); }

/* ---------- panel ---------- */
var panel=document.getElementById('panel');
function total(){ return areas.reduce(function(t,a){ return a.line?t:t+(a.sub?-1:1)*areaM2(a.pts)*SQFT; },0); }
function lineFt(){ return areas.reduce(function(t,a){ return a.line?t+perimM(a.pts,false)*FT:t; },0); }
function render(){
  if(draw&&draw.line){ var D=draw.pts.length>1?perimM(draw.pts,false)*FT:0;
    panel.innerHTML='<div class="drawing">Tap along the path for '+esc(draw.name)+'. '+(draw.pts.length<2?'At least 2 points.':'Tap Done when you reach the end.')+'</div>'+
      '<div class="total"><div><span class="eyebrow">'+esc(draw.name)+'</span><div class="v">'+len(D)+'</div></div><span class="s">'+draw.pts.length+' points</span></div>'+
      '<div class="bar"><button class="btn" data-a="undo"'+(draw.pts.length?'':' disabled')+'>Undo point</button><button class="btn" data-a="cancel">Cancel</button><button class="btn primary" data-a="done" style="margin-left:auto"'+(draw.pts.length>=2?'':' disabled')+'>Done</button></div>';
    return; }
  if(draw){ var A=areaM2(draw.pts)*SQFT, P=perimM(draw.pts,draw.pts.length>2)*FT;
    panel.innerHTML='<div class="drawing">Tap each corner of '+esc(draw.name)+'. '+(draw.pts.length<3?'At least 3 points.':'Tap the yellow first point or Done to close it.')+'</div>'+
      '<div class="total"><div><span class="eyebrow">'+esc(draw.name)+'</span><div class="v">'+fmt(A)+' sq ft</div></div><span class="s">'+draw.pts.length+' points · '+len(P)+' around</span></div>'+
      '<div class="bar"><button class="btn" data-a="undo"'+(draw.pts.length?'':' disabled')+'>Undo point</button><button class="btn" data-a="cancel">Cancel</button><button class="btn primary" data-a="done" style="margin-left:auto"'+(draw.pts.length>=3?'':' disabled')+'>Done</button></div>';
    return; }
  var t=total(), lf=lineFt(), polys=areas.filter(function(a){return !a.line;}), pf=polys.filter(function(a){return !a.sub;}).reduce(function(s,a){ return s+perimM(a.pts,true)*FT; },0);
  panel.innerHTML=(areas.length?
    '<div class="total"><div><span class="eyebrow">'+(place?esc(place):'Total')+'</span><div class="v">'+(polys.length?fmt(t)+' sq ft':len(lf))+'</div></div><span class="s">'+(polys.length?(t/43560).toFixed(2)+' acres · '+len(pf)+' around':'Total distance')+'</span></div>'+
    (polys.length&&polys.length<areas.length?'<div class="s" style="color:var(--muted);font-size:.9rem">Lines total: '+len(lf)+'</div>':'')+
    '<div class="areas">'+areas.map(function(a,i){ return '<div class="area'+(a.sub?' sub':'')+'"><span class="sw" style="background:'+(a.sub?'#e53935':a.color)+'"></span>'+
      '<input data-i="'+i+'" value="'+esc(a.name)+'" aria-label="'+(a.line?'Line':'Area')+' name">'+(a.line?'<span></span>':'<button class="tog" data-a="tog" data-i="'+i+'" title="Add or subtract this area">'+(a.sub?'− Subtract':'+ Add')+'</button>')+
      '<span class="bar" style="gap:4px;flex-wrap:nowrap"><span class="n">'+(a.line?len(perimM(a.pts,false)*FT):fmt(areaM2(a.pts)*SQFT))+'</span><button class="x" data-a="del" data-i="'+i+'" aria-label="Delete '+(a.line?'line':'area')+'">×</button></span></div>'; }).join('')+'</div>':
    '<p class="hint">'+(place?'Zoom in on the property, then tap <b>New area</b> or <b>New distance</b> and tap the points.':'Search an address, then tap <b>New area</b> or <b>New distance</b> and tap the points.')+'</p>')+
    '<div class="bar"><button class="btn primary" data-a="new">+ New area</button><button class="btn primary" data-a="newline">+ New distance</button>'+(areas.length?'<button class="btn" data-a="copy">Copy</button><button class="btn" data-a="clear" style="margin-left:auto">Clear all</button>':'')+'</div>'+
    (polys.length?'<p class="hint" style="font-size:.82rem">Tip: draw the whole yard, then draw the house, driveway or patio and switch it to <b>Subtract</b>.</p>':'');
}
panel.addEventListener('click',function(e){ var b=e.target.closest('[data-a]'); if(!b||b.disabled) return; var a=b.getAttribute('data-a'), i=+b.getAttribute('data-i');
  if(a==='new') startDraw(); else if(a==='newline') startDraw(true); else if(a==='undo') undo(); else if(a==='cancel') cancel(); else if(a==='done') finish();
  else if(a==='tog'){ areas[i].sub=!areas[i].sub; restyle(); render(); }
  else if(a==='del'){ map.removeLayer(areas[i].shape); areas.splice(i,1); restyle(); render(); }
  else if(a==='clear'){ if(clear.armed){ areas.forEach(function(x){ map.removeLayer(x.shape); }); areas=[]; n=0; nL=0; clear.armed=false; restyle(); render(); } else { clear.armed=true; b.textContent='Tap again to clear'; setTimeout(function(){ clear.armed=false; if(!draw) render(); },3000); } }
  else if(a==='copy'){ var txt=(place?place+'\n':'')+areas.map(function(x){ if(x.line){ var f=perimM(x.pts,false)*FT; return x.name+': '+fmt(f)+' ft ('+yd(f)+')'; } return (x.sub?'− ':'')+x.name+': '+fmt(areaM2(x.pts)*SQFT)+' sq ft'; }).join('\n')+(areas.some(function(x){return !x.line;})?'\nTotal: '+fmt(total())+' sq ft ('+(total()/43560).toFixed(2)+' acres)':'')+(areas.some(function(x){return x.line;})?'\nLines total: '+fmt(lineFt())+' ft ('+yd(lineFt())+')':'');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){ toast('Copied'); },function(){ prompt('Copy this:',txt); }); }
});
function clear(){}
panel.addEventListener('change',function(e){ var i=e.target.getAttribute('data-i'); if(i!=null&&e.target.tagName==='INPUT'){ areas[+i].name=e.target.value.trim()||areas[+i].name; render(); } });
try{ var last=JSON.parse(store('measureLast')||'null'); if(last&&last.ll){ map.setView(last.ll,19); place=last.place||''; } }catch(_){}
render();
})();
</script>
</body>
</html>
