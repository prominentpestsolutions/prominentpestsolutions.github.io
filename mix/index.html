<title>Mix Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f2f4ee;--surface:#fff;--sunk:#e8ece2;--ink:#111410;--muted:#596052;--line:#d6dccd;--accent:#89c43e;--accent-ink:#0b0d09;--accent-soft:#e7f3d6;--ok:#4a7a17;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
input[type=search]{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font:700 1.25rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 0;color:var(--muted)}
.policy{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.picks{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pick{text-align:left;min-height:52px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pick b{display:block;font-weight:600;line-height:1.2}.pick span{display:block;font-size:.82rem;color:var(--muted);line-height:1.2;margin-top:2px}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.pick[aria-pressed="true"] span{color:inherit;opacity:.75}
.inputs{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.fld{display:grid;gap:8px}.lbl{font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.row input{width:100%;min-width:0;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:600 1.4rem var(--body)}
.unit{color:var(--muted);font-weight:600}
.hint{font-size:.88rem;color:var(--muted)}
.out{display:grid;gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.rh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rh b{font-size:1.1rem;font-weight:600}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:1.2rem;line-height:1;cursor:pointer;flex:none}
.rv{display:inline-block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:#f6e3b4;color:#5a4300;border-radius:6px;padding:2px 6px;vertical-align:2px}
.lvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lvs.one{grid-template-columns:1fr}
.lv{border-radius:12px;padding:10px 12px;display:grid;gap:2px;background:var(--sunk)}
.lv.std{background:var(--accent-soft)}
.lvn{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--muted)}
.amt{font:700 2rem/1.05 var(--display);letter-spacing:.01em}
.sub{font-size:.88rem;color:var(--muted)}.rate{font-size:.8rem;color:var(--muted)}
.rtu{margin:0;font:700 1.5rem var(--display);text-transform:uppercase}
.tip{margin:0;font-size:.92rem}
.lab{margin:0;font-size:.86rem;color:var(--muted)}
.lbl-link{font-weight:600;font-size:.92rem;justify-self:start}
.clear{justify-self:start;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.empty{padding:20px 12px;text-align:center;color:var(--muted);margin:0;grid-column:1/-1}
.fine{font-size:.82rem;color:var(--muted);margin:0}
@media (prefers-color-scheme: dark){.rv{background:#4a3a10;color:#f6e3b4}}

 {n:'Bifen I/T',c:'Spray',sds:'bifen-i-t',u:[{m:'gal',un:'floz',s:0.5,h:1,lab:'Label 0.33–1.0 fl oz/gal'}]},
 {n:'Cyzmic CS',c:'Spray',sds:'cyzmic-cs',u:[{m:'gal',un:'floz',s:0.4,h:0.8,lab:'Label 0.2–0.4 fl oz/gal; 0.8 for heavy infestations'}]},
 {n:'Dominion 2L',c:'Spray',sds:'dominion-2l',u:[{m:'gal',un:'floz',s:0.4,h:0.6,lab:'Label 0.3–0.6 fl oz/gal (0.05–0.1%)'}]},
 {n:'Taurus SC',c:'Spray',sds:'taurus-sc',u:[{m:'gal',un:'floz',s:0.8,h:0.8,lab:'Label 0.8 fl oz/gal (0.06%) for perimeter. The 1.6 oz rate is for termites only.'}]},
 {n:'Tekko Pro',c:'Spray',sds:'tekko-pro',u:[
   {t:'Fleas, ticks, flies, mosquitoes',m:'gal',un:'floz',s:1,h:1,lab:'Label 1 fl oz/gal'},

 {n:'Alpine WSG',c:'Spray',sds:'alpine-wsg',u:[

 {n:'Ridesco WG',c:'Spray',sds:'ridesco',u:[{m:'gal',un:'g',s:19,h:19,lab:'Label 19 g/gal'}]},

 {n:'Aqua-Kontrol',c:'Spray',sds:'aqua-kontrol-mosquito',rv:1,u:[{m:'rtu',lab:'Fogger / ULV concentrate. A mix rate isn’t set yet, so use the label.'}]},
 {n:'Mad Dog 5.4',c:'Turf & weeds',sds:'mad-dog-5-4',u:[{m:'gal',un:'floz',s:1.33,h:2,lab:'Label 0.67–2.0 fl oz/gal (1.33 annual weeds, 2.0 perennials)'}]},
 {n:'Momentum 4-Score',c:'Turf & weeds',sds:'momentum-4-score',u:[{m:'gal',un:'floz',s:1.5,h:1.7,lab:'Label 1.3–1.7 fl oz per gal, 1 gal sprays 1,000 sq ft'}]},
 {n:'LI-700 Surfactant',c:'Turf & weeds',sds:'li-700-surfactant',u:[{m:'gal',un:'floz',s:0.5,h:0.64,lab:'Label 0.25–0.5% v/v (0.32–0.64 fl oz/gal). Add it to the tank with the herbicide.'}]},
 {n:'Feature 6-0-0',c:'Turf & weeds',sds:'feature-6-0-0',u:[{m:'area',un:'floz',s:1.25,h:2,lab:'Label 1–2 fl oz per 1,000 sq ft'}]},

 {n:'Flumigard',c:'Turf & weeds',sds:'flumiguard',rv:1,u:[{m:'area',un:'floz',s:0.2,h:0.28,lab:'Label 8–12 fl oz/acre (0.18–0.28 per 1,000 sq ft)'}]},

 {n:'Contrac Blox',c:'Baits',sds:'contrac-bait',rv:1,u:[

 {n:'Mosquito Dunks',c:'Baits',sds:'mosquito-dunks',u:[{m:'water',un:'ea',s:1,h:1,lab:'Label 1 dunk per 100 sq ft of water surface. Replace every 30 days.'}]},
 {n:'In2Care',c:'Baits',sds:'in2care-mosquito',u:[{m:'acre',un:'ea',s:10,h:10,lab:'About 10 stations per acre. Refill every 4–6 weeks.'}]},
 {n:'Evolve',c:'Baits',sds:'evolve',rv:1,u:[{m:'rtu',lab:'Ready-to-use soft bait. Place it per the Evolve deployment guide.'}]},
 {n:'Advion Ant Gel',c:'Ready to use',sds:'advion-ant',u:[{m:'rtu',lab:'Gel bait, no mixing'}]},
 {n:'Advion Cockroach Gel',c:'Ready to use',sds:'advion-cockroach',u:[{m:'rtu',lab:'Gel bait, no mixing'}]},
 {n:'Aprehend',c:'Ready to use',sds:'apprehend-bed-bug',u:[{m:'rtu',lab:'Ready-to-use barrier spray, no mixing'}]},
 {n:'Cimexa Dust',c:'Ready to use',sds:'cimexa-dust',u:[{m:'rtu',lab:'Dust, no mixing'}]},

 {n:'Fuse Foam',c:'Ready to use',sds:'fuse-foam',u:[{m:'rtu',lab:'Foam aerosol, no mixing'}]},
 {n:'PT Alpine Fly Bait',c:'Ready to use',sds:'pt-alpine-fly-bait',u:[{m:'rtu',lab:'Ready-to-use bait, no mixing'}]}
];
var CATS=['Spray','Turf & weeds','Granular','Baits','Ready to use'];
var app=document.getElementById('app');
function ld(k,d){try{var v=localStorage.getItem('mix.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem('mix.'+k,JSON.stringify(v));}catch(e){}}
var S={sel:ld('sel',[]),gal:ld('gal',4),sqft:ld('sqft',1000),sta:ld('sta',10),cat:ld('cat','Spray'),q:''};
S.sel=S.sel.filter(function(k){return byKey(k);});
function key(pi,ui){return pi+'.'+ui;}
function byKey(k){var a=String(k).split('.'),p=P[+a[0]];return p&&p.u[+a[1]]?{p:p,u:p.u[+a[1]]}:null;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function r(n,d){var f=Math.pow(10,d);return Math.round(n*f)/f;}
function nf(n){return n<1?String(r(n,2)):n<10?String(r(n,2)):n<100?String(r(n,1)):String(Math.round(n));}
function fmt(un,x){
  if(un==='floz'){var ml=x*29.5735,sub=[];
    if(x<2) sub.push(nf(x*6)+' tsp');
    sub.push(Math.round(ml)+' mL');
    if(x>=32) sub.push(nf(x/128)+' gal');
    return {big:nf(x)+' fl oz',sub:sub.join(' · ')};}
  if(un==='g') return {big:nf(x)+' g',sub:nf(x/28.3495)+' oz by weight'};
  if(un==='lb'){var lb=Math.floor(x+1e-9),oz=r((x-lb)*16,1);return {big:nf(x)+' lb',sub:x<1?nf(x*16)+' oz by weight':(oz?lb+' lb '+oz+' oz':'')};}
  if(un==='blk') return {big:Math.ceil(x-1e-9)+' blocks',sub:''};
  return {big:Math.ceil(x-1e-9)+'',sub:''};
}
function calc(u,lvl){var rate=u[lvl];
  switch(u.m){
    case 'gal': case 'fin': return rate*S.gal;
    case 'area': return rate*S.sqft/1000;
    case 'sta': return rate*S.sta;
    case 'water': return Math.max(1,Math.ceil(S.sqft/100))*rate;
    case 'acre': return Math.max(1,Math.ceil(S.sqft/43560*rate));
  } return 0;}
function per(u){var un={floz:'fl oz',g:'g',lb:'lb',blk:'blocks',ea:''}[u.un];
  switch(u.m){case 'gal':return un+' per gallon';case 'fin':return un+' per finished gallon';case 'area':return un+' per 1,000 sq ft';
   case 'sta':return un+' per placement';case 'water':return 'per 100 sq ft of water';case 'acre':return 'per acre';} return '';}
function need(){var n={gal:0,area:0,sta:0};S.sel.forEach(function(k){var m=byKey(k).u.m;
  if(m==='gal'||m==='fin')n.gal=1; else if(m==='area'||m==='water'||m==='acre')n.area=1; else if(m==='sta')n.sta=1;});return n;}
function numIn(id,label,val,chips,unit,hint){
  return '<label class="fld"><span class="lbl">'+label+'</span><div class="row"><input id="'+id+'" type="number" inputmode="decimal" min="0" step="any" value="'+val+'"><span class="unit">'+unit+'</span></div>'+
   (chips?'<div class="chips">'+chips.map(function(c){return '<button class="chip" data-set="'+id+'" data-v="'+c[0]+'" aria-pressed="'+(+val===c[0])+'">'+c[1]+'</button>';}).join('')+'</div>':'')+
   (hint?'<span class="hint">'+hint+'</span>':'')+'</label>';}
function results(){
  if(!S.sel.length) return '<p class="empty">Pick a product above. You can pick more than one for a tank mix.</p>';
  var waterOut=0;
  var cards=S.sel.map(function(k){var o=byKey(k),p=o.p,u=o.u,name=p.n+(u.t?' · '+u.t:'');
    var hd='<div class="rh"><div><b>'+esc(name)+'</b>'+(p.rv?' <span class="rv">Needs review</span>':'')+'</div><button class="x" data-del="'+k+'" aria-label="Remove '+esc(name)+'">×</button></div>';
    var foot='<p class="lab">'+esc(u.lab)+'</p><a class="lbl-link" href="/sds/view.html?f='+p.sds+'.pdf&n='+encodeURIComponent(p.n)+'">Label / SDS</a>';
    if(u.m==='rtu') return '<article class="res">'+hd+'<p class="rtu">No mixing</p>'+foot+'</article>';
    var a=calc(u,'s'),b=calc(u,'h'),fa=fmt(u.un,a),fb=fmt(u.un,b),same=u.s===u.h;
    if(u.m==='fin'&&u.un==='floz') waterOut=Math.max(waterOut,b);
    var col=function(t,f,rate,cls){return '<div class="lv '+cls+'"><span class="lvn">'+t+'</span><span class="amt">'+f.big+'</span>'+(f.sub?'<span class="sub">'+f.sub+'</span>':'')+'<span class="rate">'+nf(rate)+' '+per(u)+'</span></div>';};
    var body=same?'<div class="lvs one">'+col('Rate',fa,u.s,'std')+'</div>'
      :'<div class="lvs">'+col('Standard',fa,u.s,'std')+col('Heavy / initial',fb,u.h,'hv')+'</div>';
    var extra='';
    if(u.m==='fin') extra='<p class="tip">Add the product, then top up with water to '+nf(S.gal)+' gal total (about '+nf(S.gal-a/128)+' gal of water).</p>';
    if(u.m==='water') extra='<p class="tip">For '+Math.round(S.sqft).toLocaleString()+' sq ft of standing water.</p>';
    if(u.m==='acre') extra='<p class="tip">For '+Math.round(S.sqft).toLocaleString()+' sq ft ('+nf(S.sqft/43560)+' acres).</p>';
    if(u.m==='area') extra='<p class="tip">For '+Math.round(S.sqft).toLocaleString()+' sq ft.</p>';
    return '<article class="res">'+hd+body+extra+foot+'</article>';});
  return cards.join('');
}
function render(){
  var keepFocus=document.activeElement&&document.activeElement.id, pos=keepFocus&&document.activeElement.selectionStart;
  var n=need(), q=S.q.trim().toLowerCase();
  var list=P.map(function(p,pi){return {p:p,pi:pi};}).filter(function(x){return q?x.p.n.toLowerCase().indexOf(q)>=0:x.p.c===S.cat;});
  var picks=list.map(function(x){return x.p.u.map(function(u,ui){var k=key(x.pi,ui),on=S.sel.indexOf(k)>=0;
     return '<button class="pick" data-k="'+k+'" aria-pressed="'+on+'"><b>'+esc(x.p.n)+'</b>'+(u.t?'<span>'+esc(u.t)+'</span>':'')+'</button>';}).join('');}).join('');
  var inputs='';
  if(n.gal) inputs+=numIn('gal','Gallons of water',S.gal,[[1,'1 gal'],[2,'2 gal'],[4,'4 gal backpack'],[50,'50 gal'],[100,'100 gal']],'gal');
  if(n.area) inputs+=numIn('sqft','Area to treat',S.sqft,[[1000,'1,000'],[5000,'5,000'],[10000,'10,000'],[43560,'1 acre']],'sq ft','Need the yard size? <a href="/measure/">Measure it</a>, then type it here.');
  if(n.sta) inputs+=numIn('sta','Placements / bait stations',S.sta,[[5,'5'],[10,'10'],[20,'20']],'stations');
  app.innerHTML='<a class="back" href="/">← All tools</a><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Mix Calculator</b><span class="eyebrow">How much product to add</span></div></div>'+
   '<div class="policy"><b>Standard</b> is our normal mix. We never mix at the label minimum. <b>Heavy / initial</b> is for initial services and bad infestations (label max).</div>'+
   '<input id="q" type="search" placeholder="Search products" value="'+esc(S.q)+'" autocomplete="off">'+
   (q?'':'<div class="chips cats">'+CATS.map(function(c){return '<button class="chip" data-cat="'+c+'" aria-pressed="'+(S.cat===c)+'">'+c+'</button>';}).join('')+'</div>')+
   '<div class="picks">'+(picks||'<p class="empty">No product matches.</p>')+'</div>'+
   (inputs?'<section class="inputs">'+inputs+'</section>':'')+
   '<section class="out" aria-live="polite">'+(S.sel.length>1?'<h2>Tank mix</h2>':'')+results()+'</section>'+
   (S.sel.length?'<button class="clear" id="clr">Clear all</button>':'')+
   '<p class="fine">Rates are from each product’s label. Always follow the label on the container. Anything marked “Needs review” is waiting on a manager to confirm.</p>';
  if(keepFocus){var el=document.getElementById(keepFocus);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}
}
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.k){var k=t.dataset.k,i=S.sel.indexOf(k);if(i>=0)S.sel.splice(i,1);else S.sel.push(k);sv('sel',S.sel);render();
    if(i<0){var o=document.querySelector('.out');if(o&&window.innerWidth<700)setTimeout(function(){var ins=document.querySelector('.inputs')||o;ins.scrollIntoView({behavior:'smooth',block:'start'});},50);}return;}
  if(t.dataset.del){S.sel=S.sel.filter(function(k){return k!==t.dataset.del;});sv('sel',S.sel);render();return;}
  if(t.dataset.cat){S.cat=t.dataset.cat;sv('cat',S.cat);render();return;}
  if(t.dataset.set){var id=t.dataset.set,v=+t.dataset.v;S[id]=v;sv(id,v);render();return;}
  if(t.id==='clr'){S.sel=[];sv('sel',S.sel);render();}
});
app.addEventListener('input',function(e){var t=e.target;
  if(t.id==='q'){S.q=t.value;render();return;}
  if(t.id==='gal'||t.id==='sqft'||t.id==='sta'){var v=parseFloat(t.value);if(isFinite(v)&&v>=0){S[t.id]=v;sv(t.id,v);
    var o=document.querySelector('.out');if(o)o.innerHTML=(S.sel.length>1?'<h2>Tank mix</h2>':'')+results();
    document.querySelectorAll('[data-set="'+t.id+'"]').forEach(function(c){c.setAttribute('aria-pressed',String(+c.dataset.v===v));});}}
});
render();
})();
