taking good care of tools and returning them to their designated storage location at the end of each day or when your employment ends. If any tool is damaged or lost, tell your Supervisor immediately. In some situations we may require you to provide your own hand tools; if so, this will never reduce your pay below the minimum wage or cut into required overtime pay. You must return all Company tools immediately when your employment ends."},{"t":"h3","x":"Visiting Our Clients: Jobsite Etiquette"},{"t":"p","x":"You represent our Company, and it is imperative that you always keep a professional attitude at a client’s site. Treat every client with the utmost respect and courtesy. Swearing and other foul language are not allowed. Tell your Supervisor if you have any issues or concerns about a client visit."},{"t":"h3","x":"Inclement Weather"},{"t":"p","x":"In the event of poor weather, contact your Supervisor before the start of your shift to confirm that work is available that day. In severe weather, work may be too hazardous and you will not be required to work. In some situations, your Supervisor may ask you to come to the office to perform other work duties."},{"t":"h2","x":"Section 10: General Information"},{"t":"h3","x":"Safety"},{"t":"p","x":"To provide a safe and healthy work environment for employees, customers and visitors, we maintain a workplace safety program. It is a top priority, and its success depends on the alertness and personal commitment of everyone. We share information about workplace safety, health and security through regular channels such as employee meetings, bulletin board postings, memos and other written communications. You are expected to obey safety rules and use caution in all work activities. Report any unsafe condition to your Supervisor immediately, however minor. Prompt reporting lets us correct hazards. The Company prohibits retaliation against any employee for reporting a safety concern, and you also have the right to report hazards to the Occupational Safety and Health Administration (OSHA)."},{"t":"p","x":"When you enter the shop, use your key code. If you are the last to leave the shop, you must close and lock the door behind you. If you notice a suspicious person on the premises, or any unusual or peculiar activity, notify your Supervisor or the Office Manager immediately. Some areas are restricted to authorized employees."},{"t":"h3","x":"First Aid"},{"t":"p","x":"A first aid kit for minor injuries is available in the shop. If an injury occurs, use common sense, and do not hesitate to call 911 in an emergency. Be familiar with the safety and first aid procedures in your operational manual."},{"t":"h3","x":"Housekeeping"},{"t":"p","x":"You are responsible for keeping your individual work area clean, neat and functional. Limit eating snacks or food and drinking liquids at workstations that use computer terminals, and take extra care to keep staples, paper clips and other foreign materials out of keyboards. Lunch and break rooms are the responsibility of all employees and must be kept presentable. Guests may use them, and they should not find dirty dishes, food particles or spilled liquids."},{"t":"h3","x":"Smoking and Tobacco Use"},{"t":"p","x":"Smoking and the use of tobacco or other products, such as vaping, are prohibited on Company premises, on client premises and in all Company vehicles. We do not provide additional breaks for smoking or tobacco use."},{"t":"h2","x":"Section 11: Independent Contractor (1099) Door-to-Door Sales"},{"t":"p","x":"This section applies only to individuals engaged as independent contractors (1099) to sell Company services door to door. It is part of, and must be read with, each contractor’s written Independent Contractor (1099) Sales Agreement. If this section conflicts with the signed agreement, the most recent signed agreement or addendum controls. Sections of this handbook that apply to employees, such as wage and hour, benefits and leave, do not apply to independent contractors."},{"t":"h3","x":"Door-to-Door Sales Standards and Requirements"},{"t":"p","x":"Everyone who sells door to door for the Company must meet the following standards as a condition of working with the Company."},{"t":"p","x":"Background check. You must be able to pass a background check if the Company requests one. Background checks are done only with your written consent and in compliance with the Fair Credit Reporting Act and applicable state law. Refusing to consent to, or failing, a required background check may disqualify you from sales activities or result in termination of your agreement."},{"t":"p","x":"Solicitor permits and city ordinances. You must be eligible to obtain and keep any solicitor, peddler or door-to-door sales permit required by city, county or municipal ordinances. You agree to follow all local solicitation laws, including restricted hours, no-solicitation zones, and posted “No Soliciting” or “No Trespassing” notices. Failing to obtain or follow required permits or ordinances may lead to termination of your agreement."},{"t":"p","x":"Uniform and identification. While conducting door-to-door sales, you agree to wear the Company-approved contractor uniform, which includes:"},{"t":"ul","items":["a Company-issued polo shirt;","a Company-issued hat;","visible company badge or identification; and","black shorts or other approved attire."]},{"t":"p","x":"Uniforms must be clean and professional and worn at all times during sales activities unless management approves otherwise."},{"t":"h3","x":"Professional Conduct and Representation"},{"t":"p","x":"Present yourself professionally and clearly identify yourself as an official representative of the Company. Do not misrepresent your identity, role or authority. You are strictly prohibited from:"},{"t":"ul","items":["engaging in violence, threats, intimidation or aggressive behavior;","using derogatory, discriminatory or abusive language; and","arguing with, harassing or retaliating against residents."]},{"t":"p","x":"Any violation of this conduct standard may result in immediate termination of your agreement."},{"t":"h3","x":"Ethical Sales Practices"},{"t":"p","x":"You agree to conduct all sales activities ethically, honestly and transparently. This includes:"},{"t":"ul","items":["accurately explaining the Company’s services;","clearly disclosing contract terms, pricing and cancellation policies;","giving customers any written notice of their right to cancel that the law requires (for example, the federal three-day right to cancel for sales made at a customer’s home);","avoiding false, misleading or deceptive statements; and","making sure customers understand what they are agreeing to before they sign."]},{"t":"p","x":"Misrepresentation, dishonesty or unethical sales practices are grounds for immediate action, including termination of your agreement and, to the extent your written agreement and applicable law allow, forfeiture of commissions."},{"t":"h3","x":"Independent Contractor Tax Responsibility"},{"t":"p","x":"Individuals classified as independent contractors are solely responsible for paying all applicable federal, state and local taxes on compensation paid by the Company. This includes, but is not limited to, income taxes, self-employment taxes, Social Security, Medicare, unemployment insurance and any other required payments. The Company does not withhold taxes from payments to independent contractors and will issue an IRS Form 1099 as the law requires. Independent contractors are also responsible for obtaining any business license, insurance or state certificate that the law requires of them (for example, a Montana independent contractor exemption certificate)."},{"t":"h3","x":"Compensation and Pay Schedule"},{"t":"p","x":"Independent contractors are paid according to their custom pay scale, as agreed in writing with the Company. Compensation may be commission-based or otherwise structured as set out in the contractor’s individual agreement. Payments are made every two weeks, subject to verification and approval of completed sales, account activation, and any applicable chargebacks, cancellations or adjustments. Only valid, approved sales are eligible for payment. The Company reserves the right to adjust or withhold payment for sales that are found to be incomplete, fraudulent, non-compliant or in violation of Company policies, as provided in the contractor’s written agreement and consistent with applicable law."},{"t":"p","x":"Any change to an independent contractor’s compensation, pay structure, duties, territory or terms of engagement must be in writing and issued as a formal addendum to the Independent Contractor (1099) Sales Agreement. Verbal agreements, text messages, emails or informal understandings do not change the terms of the agreement unless they are expressly included in a written addendum signed by both the Company and the contractor. The most recent signed addendum controls in any conflict with earlier communications or understandings."},{"t":"h2","x":"Section 12: State Supplements for Idaho, Wyoming and Montana"},{"t":"p","x":"This section applies to employees who work in Idaho, Wyoming or Montana. If this section conflicts with another part of this handbook, this section controls for employees working in that state. Where the law of your state gives you greater rights than this handbook, the law controls."},{"t":"tbl","head":["Topic","Idaho","Wyoming","Montana"],"rows":[["Employment relationship","At-will","At-will","At-will only during the probationary period. After it, discharge must be for good cause (see below)."],["Final pay after resignation","By the next regular payday or within 10 days, whichever comes first","By the next regular payday","By the next regular payday or within 15 days, whichever comes first"],["Final pay after termination","By the next regular payday or within 10 days, whichever comes first, or sooner if you request it as Idaho law allows","By the next regular payday, or within five working days if that is sooner","By the next regular payday, under this written Company policy"],["Jury service","Time off protected; unpaid for non-exempt employees","Time off protected; unpaid for non-exempt employees","Protected as a legally required absence; unpaid for non-exempt employees"],["Meal and rest breaks","Company policy in Section 4 applies","Company policy in Section 4 applies","Company policy in Section 4 applies"],["Drug and alcohol testing","Done under the written procedure in Section 7","Done under the written procedure in Section 7","Limited to the jobs, situations and procedures allowed by the Montana Workforce Drug and Alcohol Testing Act"],["Lawful off-duty use of marijuana, alcohol or tobacco","Section 7 applies","Section 7 applies","Protected by Montana law when off the premises during non-working hours, subject to the exceptions in Montana law"]]},{"t":"h3","x":"Montana: Probationary Period and Good Cause"},{"t":"p","x":"Montana law requires that, after an employee completes the employer’s probationary period, a discharge be for good cause. During the probationary period, employment is at-will and may be ended by you or by the Company at any time, with or without cause or notice."},{"t":"p","x":"The probationary period for Montana employees is 3 months from your date of hire. After you complete the probationary period, the Company will discharge you only for good cause. Good cause means reasonable job-related grounds, based on a failure to satisfactorily perform job duties, disruption of the Company’s operation, or other legitimate business reasons, and includes a material or repeated violation of an express provision of the Company’s written policies."},{"t":"p","x":"The Company may use progressive discipline, but it is not required to follow any particular sequence of steps."},{"t":"h3","x":"Montana: Final Pay"},{"t":"p","x":"It is the written policy of the Company that final wages for Montana employees who are discharged or laid off are paid on the next regular payday. Final wages for Montana employees who resign are paid by the next regular payday or within 15 days, whichever comes first."},{"t":"h3","x":"Montana: Drug and Alcohol Testing"},{"t":"p","x":"Montana law limits workplace drug and alcohol testing to certain positions (including work in a hazardous work environment, work in a security-sensitive position, and work involving a fiduciary responsibility) and to certain situations. Testing of Montana employees is done only in accordance with the Montana Workforce Drug and Alcohol Testing Act and a written testing policy given to affected employees before testing begins. Montana employees who are subject to testing will receive that written policy separately."},{"t":"h3","x":"Montana: Pregnancy Leave"},{"t":"p","x":"Montana law provides that an employee will be given a reasonable leave of absence for pregnancy. If you tell us when your leave begins that you intend to return when it ends, you will be reinstated to your job or an equivalent position, unless circumstances have changed so that this is impossible or unreasonable. Please contact the Office Manager if you need pregnancy leave."},{"t":"h3","x":"Montana: Vacation and PTO Payout"},{"t":"p","x":"Montana law limits the conditions that can be placed on payout of earned vacation or PTO when employment ends. Whatever PTO payout policy the Company adopts in Section 5 must follow those limits for Montana employees."},{"t":"h3","x":"Idaho and Wyoming"},{"t":"p","x":"Employment of Idaho and Wyoming employees is at-will, as described in Section 1. Idaho and Wyoming employees are not covered by the Montana provisions above."},{"t":"h2","x":"Section 13: Additional Policies for Pest Control and Wildlife Work"},{"t":"p","x":"These policies cover risks that are specific to our work."},{"t":"h3","x":"Licensing and Training"},{"t":"p","x":"You may apply pesticides, handle restricted-use products or perform wildlife control only if you hold every license, certification and permit that state and federal law requires for that work, and only within the scope of that license. Tell the Office Manager immediately if a license lapses, is suspended or is revoked. You must complete all required safety and technical training, and the Company will record it in your training file."},{"t":"h3","x":"Chemical Safety and Protective Equipment"},{"t":"p","x":"Follow the product label exactly; the label is the law. Read the label and safety data sheet before you use a product. Wear all required protective equipment, and keep it clean and in good condition. Tell your Supervisor right away about any spill, leak, exposure, illness after exposure or damaged equipment, and get medical attention when needed. Where a respirator is required, you must complete the required medical evaluation and fit testing before use. Store, transport and dispose of chemicals only as the label, the law and Company procedures allow."},{"t":"h3","x":"Wildlife and Animal Safety"},{"t":"p","x":"Report any bite, scratch, sting or contact with bats or other wildlife to your Supervisor immediately, even if the injury seems minor. Use the required protective equipment and follow Company procedures for handling and removing animals. Follow all state and federal wildlife laws, and do not trap, handle or remove any protected species or nesting animal unless the law and Company management have authorized it."},{"t":"h3","x":"Ladders, Roofs and Heights"},{"t":"p","x":"You may climb or work from a ladder only if you have completed ladder safety training and a Supervisor has signed off on that training. Inspect ladders before each use, set them up correctly, and use required fall protection when working on roofs or at heights. Do not work on a roof or at height in unsafe conditions, including ice, high wind or lightning. Stop work and tell your Supervisor if you believe a job is unsafe."},{"t":"h3","x":"Driving Eligibility"},{"t":"p","x":"Everyone who drives for the Company must hold a valid driver’s license and meet the Company’s insurance requirements. The Company may review your driving record, with your consent where the law requires it, when you are hired and periodically afterward. You must tell the Office Manager within 2 days of any license suspension or revocation, and of any citation or accident that happens while you are driving on Company business."},{"t":"h3","x":"Reimbursement of Business Expenses"},{"t":"p","x":"The Company reimburses reasonable, necessary business expenses that you incur at its request, other than personal phones and phone service, which the Company does not pay for (see Section 8). Submit expenses with receipts to your Supervisor within 14 days of receiving the receipt. Required expenses will never reduce a non-exempt employee’s pay below the minimum wage or overtime pay."},{"t":"h3","x":"Customer Property and Privacy"},{"t":"p","x":"Treat every customer’s home and property with care. Report any damage, or any customer complaint, to your Supervisor right away. Do not photograph or record private areas of a customer’s property or any person, except as the job requires and as Company procedures allow. Keep customer information confidential, and do not share it or use it for any purpose other than Company business."},{"t":"h3","x":"Severability and Electronic Acknowledgment"},{"t":"p","x":"If any provision of this handbook is held invalid or unenforceable, the rest of the handbook remains in effect. The Company may deliver this handbook and any updates to you electronically, and your electronic acknowledgment has the same effect as a signed one."},{"t":"h2","x":"Section 14: Protecting Our Customer Relationships"},{"t":"p","x":"Our customer relationships are among the Company’s most valuable assets, built through years of investment in marketing, training, and service. This section explains what we expect while you work here and how we protect those relationships afterward."},{"t":"h3","x":"During Your Employment or Engagement"},{"t":"p","x":"While you work for or with the Company, you may not:"},{"t":"ul","items":["solicit or accept work from a Company customer or prospect for yourself or for anyone else, in competition with the Company;","divert, redirect or discourage a customer from using the Company’s services;","use Company customer lists, pricing, service history or contact information for any purpose other than Company business; or","tell customers or prospects that you are leaving to start or join a competing business."]},{"t":"p","x":"These rules apply in every state where we operate, to employees and to independent contractors. A violation may lead to discipline, up to and including termination."},{"t":"h3","x":"Return of Customer Information"},{"t":"p","x":"When your employment or engagement ends, you must return all Company property and customer information immediately, in any form (paper, phone, email, text, photos, apps or cloud accounts), and you may not keep copies. Do not delete Company data from Company devices or accounts before returning them."},{"t":"h3","x":"Notice to a New Employer"},{"t":"p","x":"The Company may remind your new employer or business of your continuing duty to keep Company information confidential."},{"t":"h3","x":"Rights That Are Not Affected"},{"t":"p","x":"Nothing in this section prohibits you from discussing your own wages, hours or working conditions, from reporting possible violations of law to a government agency, or from working in the pest control or wildlife industry after your employment or engagement ends."},{"t":"h2","x":"Acknowledgment of Receipt of Handbook"},{"t":"p","x":"I acknowledge that this Employee Handbook supersedes and replaces any other employee handbook or similar document that may have been previously distributed to me. I understand that I am responsible for becoming familiar with the policies in this Employee Handbook, and I agree to comply with all rules that apply to me."},{"t":"p","x":"I understand that, except as provided in Section 12 for employees working in Montana, my employment relationship with the Company is at-will and can be ended by the Company or by me at any time, with or without cause or notice. I also understand that the Company has the right to change my position or impose any form of discipline it considers appropriate at any time. Nothing in this Employee Handbook is intended to change the Company’s policy of at-will employment, and only a written agreement signed by the President of the Company may change the at-will employment relationship."},{"t":"p","x":"I understand that the policies described in this Employee Handbook are intended as a guide only and do not constitute a contract of employment. I understand that the Company reserves the right to change its policies, procedures or benefits at any time, in its discretion, consistent with applicable law, and to interpret its policies and vary its procedures as it considers necessary or appropriate. I understand that any delay or failure by the Company to enforce a rule or procedure in this Employee Handbook is not a waiver of the Company’s right to do so in the future."},{"t":"p","x":"By my signature below, I acknowledge that I have received a copy of this Employee Handbook. I also acknowledge that I have read it, understand it, and agree to follow the policies and procedures in it."}],"signBlocks":[{"t":"p","x":"Prominent Pest Solutions Employee Handbook, 2026 Edition (35 pages, Sections 1 to 14). The full handbook is posted in the Prominent Hub under Handbook & Policies."},{"t":"h2","x":"Acknowledgment of Receipt of Handbook"},{"t":"p","x":"I acknowledge that this Employee Handbook supersedes and replaces any other employee handbook or similar document that may have been previously distributed to me. I understand that I am responsible for becoming familiar with the policies in this Employee Handbook, and I agree to comply with all rules that apply to me."},{"t":"p","x":"I understand that, except as provided in Section 12 for employees working in Montana, my employment relationship with the Company is at-will and can be ended by the Company or by me at any time, with or without cause or notice. I also understand that the Company has the right to change my position or impose any form of discipline it considers appropriate at any time. Nothing in this Employee Handbook is intended to change the Company’s policy of at-will employment, and only a written agreement signed by the President of the Company may change the at-will employment relationship."},{"t":"p","x":"I understand that the policies described in this Employee Handbook are intended as a guide only and do not constitute a contract of employment. I understand that the Company reserves the right to change its policies, procedures or benefits at any time, in its discretion, consistent with applicable law, and to interpret its policies and vary its procedures as it considers necessary or appropriate. I understand that any delay or failure by the Company to enforce a rule or procedure in this Employee Handbook is not a waiver of the Company’s right to do so in the future."},{"t":"p","x":"By my signature below, I acknowledge that I have received a copy of this Employee Handbook. I also acknowledge that I have read it, understand it, and agree to follow the policies and procedures in it."}]},
{id:'timeoff',title:'Time Off Request & Attendance Strike Policy',version:'Nov 5, 2026',sub:'Requesting time off, exceptions, and the strike system',
 ack:'I have read and understand the Time Off Request & Attendance Strike Policy.',
 blocks:[
 {t:'h2',x:'Purpose and scope'},
 {t:'p',x:'All planned time off must be requested at least 3 days in advance so we can reschedule customers and keep routes covered. Short-notice requests earn a strike; 3 strikes trigger a consequence, not termination.'},
 {t:'p',x:'This policy applies to all full-time, part-time, and seasonal employees of Prominent Pest and Wildlife.'},
 {t:'h2',x:'Requesting time off'},
 {t:'p',x:'Requests must reach your manager at least 3 full calendar days (72 hours) before the start of your scheduled shift.'},
 {t:'ol',items:['Submit the request.','Include the dates, the hours you\'ll miss, and whether it\'s paid or unpaid time.','Requests are approved first-come, first-served. During peak season, the company may limit how many people are off at once.']},
 {t:'p',x:'Example: for time off on Friday, the request is due by the start of your Tuesday shift.'},
 {t:'h2',x:'Exceptions — no strike'},
 {t:'p',x:'The following never count as a strike, as long as you notify your manager as soon as reasonably possible (before your shift whenever you can):'},
 {t:'ul',items:['Your own illness or injury','Sudden illness or emergency involving a spouse, child, or parent','Death in the family','Car breakdown, accident, or severe weather that makes travel unsafe','Jury duty, court subpoena, or military service','Any leave protected by federal or state law (Idaho, Wyoming, or Montana, depending on where you work)']},
 {t:'p',x:'The company may ask for reasonable documentation (for example, a tow receipt or jury summons) when a pattern develops. We will never ask for details of a medical condition.'},
 {t:'p',x:'The manager may also waive a strike at their discretion for situations not listed here.'},
 {t:'h2',x:'The strike system'},
 {t:'p',x:'A strike is issued each time planned time off is requested with less than 3 days\' notice and does not fall under an exception.'},
 {t:'kv',items:[['3+ days','No strike'],['Less than 3 days','1 strike'],['No notice before the shift (no-call/no-show)','2 strikes']]},
 {t:'ul',items:['Each strike is documented in writing, dated, and shared with the employee within 2 working days.','Each strike expires 6 months after it was issued. Strikes do not stack forever.','An employee who goes 90 days with no new strikes may have their oldest active strike removed early.','A strike can be disputed within 7 days by talking to the owner.']},
 {t:'h2',x:'What happens at 3 strikes'},
 {t:'p',x:'Three active strikes trigger two things, and then strikes reset to zero:'},
 {t:'ol',items:['Donuts for the team. The employee brings donuts for everyone at the next in-person team meeting.','Reset meeting with a manager. A short one-on-one within a week to talk through what\'s causing the late notice and agree on a plan to fix it.']},
 {t:'p',x:'If an employee reaches 3 strikes a second time within 12 months, the next step is a formal performance improvement plan. Termination is not automatic under this policy, but repeated violations combined with other performance issues may still be considered.'}]}];
var app=document.getElementById('app'), S={doc:-1,name:'',signed:{},busy:false,err:'',done:null,inked:false};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
S.name=ls('pol.name')||'';S.email=ls('pol.email')||ls('to.email')||'';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(fn,args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Error');return j.data;});}
function vk(v){var d=Date.parse(v);return isNaN(d)?String(v):new Date(d).toDateString();}
function loadSigned(){if(!S.name)return;api('policySigned',[S.name]).then(function(l){S.signed={};l.forEach(function(x){var k=x.policy+'|'+vk(x.version);if(!S.signed[k]||x.when>S.signed[k])S.signed[k]=x.when;});render(true);}).catch(function(){});}
function block(b,i){
  if(b.t==='h2')return '<h2 class="ph" id="b'+i+'">'+esc(b.x)+'</h2>';
  if(b.t==='h3')return '<h3 class="ph3">'+esc(b.x)+'</h3>';
  if(b.t==='tbl')return '<div class="tblw"><table><thead><tr>'+b.head.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+b.rows.map(function(r){return '<tr>'+r.map(function(c,k){return '<td data-h="'+esc(b.head[k])+'">'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
  if(b.t==='ul'||b.t==='ol')return '<'+b.t+'>'+b.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</'+b.t+'>';
  if(b.t==='kv')return '<ul class="kv">'+b.items.map(function(i){return '<li><b>'+esc(i[0])+'</b> '+esc(i[1])+'</li>';}).join('')+'</ul>';
  return '<p>'+esc(b.x)+'</p>';}
function signedOn(p){var w=S.signed[p.title+'|'+vk(p.version)];return w?new Date(w).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'}):'';}
function head(sub){return '<a class="back" href="'+(S.doc>=0?'#':'/')+'">'+(S.doc>=0?'← Handbook & Policies':'← All tools')+'</a><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Handbook &amp; Policies</b><span class="eyebrow">'+esc(sub||'Read and sign')+'</span></div></div>';}
function homeView(){var h=head();
  POL.forEach(function(p,i){if(!p.hb)return;var on=signedOn(p);h+='<a class="hbc" href="#p'+i+'"><span class="pill">'+esc(p.version)+'</span><b>'+esc(p.title)+'</b><span class="hbs">'+esc(p.sub)+'</span>'+(on?'<span class="ok">✓ You signed '+esc(on)+'</span>':'<span class="need">Needs your signature</span>')+'</a>';});
  h+='<h2 class="lib">Policies</h2><div class="docs">'+POL.map(function(p,i){if(p.hb)return '';var on=signedOn(p);return '<a class="doc" href="#p'+i+'"><b>'+esc(p.title)+'</b><span>'+esc(p.sub)+'</span>'+(on?'<span class="ok">✓ You signed '+esc(on)+'</span>':'<span class="need">Needs your signature</span>')+'</a>';}).join('')+'</div>';
  h+='<p class="muted small">'+(S.name?'Showing signatures for '+esc(S.name)+'. <button class="link" data-a="notme">Not you?</button>':'Open a policy, read it, and sign at the bottom. Signed copies are saved for the office.')+'</p>';
  return h;}
function docView(){var p=POL[S.doc];if(!p){S.doc=-1;return homeView();}
  var on=signedOn(p),h=head('Version '+p.version);
  h+='<h1>'+esc(p.title)+'</h1>';
  if(p.hb){var tc=[];p.blocks.forEach(function(b,i){if(b.t==='h2')tc.push('<li><button type="button" class="link" data-a="jump" data-to="b'+i+'">'+esc(b.x)+'</button></li>');});
    h+='<nav class="card toc"><h2>Jump to section</h2><ol>'+tc.join('')+'<li><button type="button" class="link" data-a="jump" data-to="sign">Sign the acknowledgment</button></li></ol>'+(p.pdf?'<a class="pdfl" href="'+esc(p.pdf)+'" target="_blank" rel="noopener">Download the PDF</a>':'')+'</nav>';}
  h+='<article class="card pol">'+p.blocks.map(block).join('')+'</article>';
  if(p.hb)h+='<p class="totop"><button type="button" class="link" data-a="jump" data-to="app">↑ Back to top</button></p>';
  if(S.done){h+='<section class="card done"><h2>Signed</h2><p>Thanks, '+esc(S.name)+'. Your signed copy was saved on '+esc(S.done.when)+'.'+(S.done.emailed?' A PDF copy was emailed to '+esc(S.done.email)+'.':' We could not email your copy, so ask the office for it.')+'</p><a class="btn" href="#">Back to policies</a></section>';return h;}
  h+='<section class="card signbox" id="sign"><h2>'+(p.hb?'Sign the acknowledgment':'Sign this policy')+'</h2>'+(on?'<p class="ok">You already signed this version on '+esc(on)+'. You can sign again if a manager asks you to.</p>':'')+
   '<label class="chk"><input type="checkbox" id="ack"><span>'+esc(p.ack)+'</span></label>'+
   '<label class="fld">Full name<input id="nm" autocomplete="name" placeholder="First and last name" value="'+esc(S.name)+'"></label>'+
   '<label class="fld">Email for your signed copy<input id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="'+esc(S.email)+'"></label>'+
   '<div class="fld">Signature<div class="pad"><canvas id="pad"></canvas><span class="hint" id="hint">Sign here with your finger</span></div><button type="button" class="link" data-a="clear">Clear signature</button></div>'+
   (S.err?'<p class="err">'+esc(S.err)+'</p>':'')+
   '<button class="btn primary" data-a="sign" '+(S.busy?'disabled':'')+'>'+(S.busy?'Saving…':'Sign and submit')+'</button><p class="muted small">Date and time are added automatically. A PDF copy goes to the office and to your email.</p></section>';
  return h;}
var pad=null,ctx=null,drawing=false;
function setupPad(){var c=document.getElementById('pad');if(!c)return;pad=c;var r=c.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';S.inked=false;
  function pt(e){var b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];}
  c.addEventListener('pointerdown',function(e){e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;var p=pt(e);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+.1,p[1]+.1);ctx.stroke();S.inked=true;var h=document.getElementById('hint');if(h)h.hidden=true;});
  c.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();var p=pt(e);ctx.lineTo(p[0],p[1]);ctx.stroke();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){c.addEventListener(n,function(){drawing=false;});});}
function sigPng(){var w=pad.width,h=pad.height,o=document.createElement('canvas'),s=Math.min(1,600/w);o.width=Math.round(w*s);o.height=Math.round(h*s);var x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(pad,0,0,o.width,o.height);return o.toDataURL('image/png');}
function render(keep){var y=window.scrollY;app.innerHTML=S.doc>=0?docView():homeView();setupPad();if(keep===true)window.scrollTo(0,y);}
function route(){var m=/^#p(\d+)$/.exec(location.hash);S.doc=m?+m[1]:-1;S.done=null;S.err='';render();window.scrollTo(0,0);}
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.a==='jump'){var el=document.getElementById(t.dataset.to);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(t.dataset.a==='clear'&&ctx){ctx.clearRect(0,0,pad.width,pad.height);S.inked=false;var h=document.getElementById('hint');if(h)h.hidden=false;}
  if(t.dataset.a==='notme'){S.name='';S.email='';S.signed={};ls('pol.name',null);ls('pol.email',null);ls('to.email',null);render();}
  if(t.dataset.a==='sign'){var p=POL[S.doc],nm=(document.getElementById('nm').value||'').replace(/\s+/g,' ').trim(),ack=document.getElementById('ack').checked,em=(document.getElementById('em').value||'').trim();
    if(!ack)S.err='Check the box to agree to the policy.';else if(nm.split(' ').length<2||nm.length<3)S.err='Enter your first and last name.';else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))S.err='Enter your email to get your signed copy.';else if(!S.inked)S.err='Please sign in the box.';else S.err='';
    if(S.err){var keep=nm,sig=S.inked?sigPng():null;render(true);document.getElementById('nm').value=keep;document.getElementById('em').value=em;document.getElementById('ack').checked=ack;if(sig){var im=new Image();im.onload=function(){var r=pad.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height);S.inked=true;document.getElementById('hint').hidden=true;};im.src=sig;}return;}
    var data=sigPng();S.busy=true;t.disabled=true;t.textContent='Saving…';
    api('policySign',[{title:p.title,version:p.version,blocks:p.signBlocks||p.blocks,ackText:p.ack,name:nm,email:em,sig:data,ack:true}]).then(function(r){S.busy=false;S.name=nm;ls('pol.name',nm);S.email=em;ls('pol.email',em);ls('to.email',em);S.signed[p.title+'|'+vk(p.version)]=Date.now();S.done=r;render();window.scrollTo(0,document.body.scrollHeight);})
      .catch(function(x){S.busy=false;S.err=String(x.message||x);t.disabled=false;t.textContent='Sign and submit';var er=app.querySelector('.signbox .err');if(!er){er=document.createElement('p');er.className='err';t.parentNode.insertBefore(er,t);}er.textContent=S.err;});}});
window.addEventListener('hashchange',route);
route(); loadSigned();
})();
</script>
