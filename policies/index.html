<title>Handbook &amp; Policies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f2f4ee;--surface:#fff;--sunk:#e8ece2;--ink:#111410;--muted:#596052;--line:#d6dccd;--accent:#89c43e;--accent-ink:#0b0d09;--accent-soft:#e7f3d6;--ok:#4a7a17;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
input[type=search]{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1{font:700 2rem/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font:700 1.3rem/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
h3{font:700 1.08rem/1.25 var(--body);margin:14px 0 4px}
a{color:var(--ok)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.err{color:#b3261e;font-weight:600;margin:0}
.ok{color:var(--ok);font-weight:600;margin:0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.link{background:none;border:0;color:var(--ok);font-weight:600;cursor:pointer;padding:0}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:grid;gap:12px;max-width:440px}
.lock input{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:600 1.2rem var(--body)}
input[type=search]{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px}
.start{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.start h2 a{color:inherit;text-decoration:none}
.chap{margin:4px 0 0;padding-left:22px;columns:2 220px;column-gap:24px}
.chap li{margin:0 0 6px;break-inside:avoid}
.chap a{color:var(--ink);text-decoration:none;font-weight:500}
.lib{margin-top:6px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;text-decoration:none;color:var(--ink);min-height:84px;align-content:start}
.doc b{font-weight:700;line-height:1.25}
.doc span{font-size:.85rem;color:var(--muted)}
.hits{display:grid;gap:8px}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.hit .where{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hit .snip{font-size:.95rem}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tools select{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font:inherit;color:inherit}
.intro{display:grid;gap:4px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.sec>summary{cursor:pointer;list-style:none;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font:700 1.15rem/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-size:1.4rem;color:var(--muted);flex:none}
details.sec[open]>summary::after{content:"–"}
details.sec .body{padding:0 16px 16px}
ul,ol{margin:0 0 10px;padding-left:22px}
li{margin:0 0 6px}
.say{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0 0 10px;display:grid;gap:8px}
.say p{margin:0;font-style:italic}
.copy{justify-self:start;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink)}
.note{border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 10px 10px 0;padding:10px 12px;margin:0 0 10px}
.note.warn{border-left-color:#b3261e}
.note.warn b{color:#b3261e}
details.qa{border:1px solid var(--line);border-radius:12px;margin:0 0 8px;background:var(--bg)}
details.qa summary{cursor:pointer;padding:12px 14px;font-weight:600}
details.qa p{padding:0 14px 12px;margin:0}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:2px 10px;margin:0}
.steps li::before{content:counter(s);grid-row:span 2;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 1.2rem var(--display)}
.steps li span{color:var(--muted)}
.never{list-style:none;padding:0}
.never li{padding-left:26px;position:relative;color:#b3261e;font-weight:600}
.never li::before{content:"✕";position:absolute;left:4px}
.check{list-style:none;padding:0}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ok)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.tw{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{background:var(--ink);color:var(--bg);text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;min-width:120px}
td:first-child{font-weight:600}
.flash{animation:fl 1.8s ease}
@keyframes fl{0%,40%{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:none}}
.pn{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:.92rem}
.pn a{text-decoration:none;max-width:48%}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.imp .file{position:relative;overflow:hidden;justify-self:start}
.imp .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.soonc{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:16px;display:grid;gap:4px}
.soonc b{font:700 1.3rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.soonc span:last-child{color:var(--muted);font-size:.92rem}
.pill{justify-self:start;background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.doc .ok,.doc .need{font-size:.8rem;font-weight:600}
.doc .need{color:#b3261e}
.small{font-size:.85rem}
.pol{gap:4px}
.pol .ph{font:700 1.1rem/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:12px 0 2px}
.pol .ph:first-child{margin-top:0}
.kv li b{display:block}
.signbox{gap:14px;border-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ok)}
.fld{display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)}
.fld input{min-height:50px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:500 1.05rem var(--body);color:var(--ink)}
.pad{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff;height:170px}
.pad canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:10px;cursor:crosshair}
.pad .hint{position:absolute;inset:0;display:grid;place-items:center;color:#8a8f86;font-weight:500;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);min-height:52px;font-size:1.05rem}
.done{border-color:var(--ok)}
.done .btn{justify-self:start}

.hbc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.hbc b{font:700 1.3rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.hbc .hbs{color:var(--muted);font-size:.92rem}
.pol .ph3{font-weight:700;font-size:1rem;margin:12px 0 0}
.pol h2.ph{scroll-margin-top:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.pol h2.ph:first-child{border-top:0;padding-top:0;margin-top:0}
.toc h2{font:700 1.1rem/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.toc ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.hbc .need{color:#b3261e;font-size:.8rem;font-weight:600}
.hbc .ok{font-size:.8rem}
.toc .link{text-align:left;padding:4px 0}
.pdfl{color:var(--ok);font-weight:600}
#sign{scroll-margin-top:12px}
.totop{margin:0;text-align:right}
.tblw{overflow-x:auto}
.tblw table{border-collapse:collapse;width:100%;font-size:.92rem}
.tblw th,.tblw td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tblw th{background:var(--sunk)}
@media (max-width:600px){.tblw thead{display:none}.tblw tr{display:block;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;padding:4px 0}.tblw td{display:block;border:0;padding:3px 10px}.tblw td:before{content:attr(data-h)": ";font-weight:600}.tblw td:first-child{font-weight:700}.tblw td:first-child:before{content:""}}

{id:'driving',title:'Driving Policy',version:'Nov 4, 2026',sub:'Safe driving, company vehicles, accidents and spills',
 ack:'I have read and understand the Prominent Pest and Wildlife Driving Policy, and I agree to follow it. I understand that violating it can lead to discipline, up to and including termination.',
 blocks:[
 {t:'h2',x:'Purpose and scope'},
 {t:'p',x:'Every Prominent Pest and Wildlife driver is responsible for driving safely and protecting our customers, the public, our vehicles, and our reputation. This policy applies to every employee who drives a company vehicle, or drives a personal vehicle for company business, in Idaho, Montana, and Wyoming.'},
 {t:'h2',x:'Driver requirements'},
 {t:'p',x:'To drive for the company, every driver must:'},
 {t:'ul',items:['Hold a valid driver\'s license for the state they drive in and keep it current','Pass a motor vehicle record (MVR) check before driving, and agree to periodic re-checks','Be approved by the owner or operations manager before driving a company vehicle','Be covered by our auto insurance, which the owner confirms before the first drive','Tell the owner or operations manager within 24 hours if their license is suspended, revoked, or restricted, or if they receive a driving citation while on the job']},
 {t:'p',x:'A driver whose license is suspended or revoked may not drive for the company until the license is reinstated.'},
 {t:'h2',x:'Safe driving rules'},
 {t:'kv',items:[['Seat belts','The driver and every passenger wear a seat belt at all times.'],['Speed and laws','Obey all posted speed limits and traffic laws. Drive for the conditions, not just the limit.'],['Phones and distractions','No handheld phone use while the vehicle is moving. No texting, scrolling, or typing. Pull over safely to take a call, read a message, or check FieldRoutes. Hands-free calls only when needed, and keep them short.'],['Impairment','Never drive under the influence of alcohol, drugs, or any medication that impairs driving. Do not drive when overly tired.'],['Weather','Slow down and leave extra space in snow, ice, rain, and fog. If conditions are unsafe, stop driving and call the office. No job is worth an accident.'],['Backing','Walk around the vehicle before backing up, use a spotter when one is available, and back slowly.'],['Following distance','Keep at least a 3-second gap, and more in bad weather or when towing or loaded.'],['Parking','Park legally and out of the way at customer properties. Set the parking brake and lock the vehicle.']]},
 {t:'h2',x:'Company vehicles'},
 {t:'kv',items:[['Business use only','Company vehicles are for company business. No personal errands or personal trips unless the owner approves it.'],['Passengers','Only employees and approved trainees ride in company vehicles. No family, friends, or pets.'],['Pre-trip check','Before each shift, check tires, lights, fluid levels, and the vehicle\'s condition. Report any problems to the operations manager right away.'],['Cleanliness','Keep the vehicle clean and organized. The vehicle wrap is our advertising, so treat it that way.'],['Fuel and company credit card','Use the company credit card for fuel and approved vehicle expenses only, and follow the company credit card policy. Keep receipts.'],['Chemicals and equipment','Store products and equipment in their approved, secured spots. Never leave chemicals, tools, or the vehicle unlocked and unattended. Never carry food or drinks in the product area.'],['Fire extinguisher','Every company vehicle must carry a charged fire extinguisher, mounted within reach of the driver, for emergencies. Check it during the pre-trip check, and report a missing, discharged, or expired unit to the operations manager right away.'],['Spill kit','Every company truck must carry a spill kit, stocked and easy to reach. Check it during the pre-trip check, and restock anything used before the next job.'],['Smoking and vaping','Not allowed in company vehicles.'],['Dash cam or tracking','Company vehicles may have GPS tracking or cameras, and the company may use them to check driving and route use.']]},
 {t:'h2',x:'Accidents and incidents'},
 {t:'p',x:'If you are in an accident, even a minor one:'},
 {t:'ol',items:['Stop, and check yourself and others for injuries. Call 911 if anyone is hurt.','Move to a safe place if you can do so, and turn on your hazard lights.','Call the owner or operations manager right away.','Call the police when required by law, or when there is injury or significant damage.','Exchange name, contact, license, and insurance information with the other driver. Do not argue or admit fault.','Take photos of the scene, all vehicles, and any damage.','If a chemical spill or release happens, follow the Chemical spills steps below.','Complete an incident report the same day.']},
 {t:'p',x:'Report every incident, including near misses, vehicle damage, and hitting a fixed object, even when no one is hurt.'},
 {t:'h2',x:'Chemical spills'},
 {t:'p',x:'Every truck carries a spill kit with absorbent material, disposable gloves, eye protection, and bags for cleanup waste. If a product spills or leaks, in the vehicle or at a customer\'s property:'},
 {t:'ol',items:['Protect people first. Stop work, keep customers, coworkers, children, and pets away, and stay upwind of the spill. Do not touch or breathe the product.','Call for help. Call 911 right away if anyone is injured or exposed, there is a fire, or the spill is large or you cannot control it. Then call the operations manager or owner first, before anyone calls the state.','Identify the product. Check the label and the SDS in the Prominent Pest app.','Put on protective gear from the spill kit and any PPE the label requires.','Stop the source if it is safe to do so, such as setting the container upright or closing the cap.','Contain it. Surround the spill with absorbent material. Keep it out of drains, storm drains, ditches, and waterways.','Clean up. Soak up the spill with absorbent material, following the label and SDS. Put the waste in a labeled bag or container. Do not hose it down or wash it away.','Report it. Tell the operations manager before you leave the site. There are laws that require some spills to be reported to the state, depending on how much spilled, and the rules vary by state.','Complete an incident report the same day, and restock the spill kit before the next job.']},
 {t:'p',x:'If you are ever unsure, keep people away and call the operations manager.'},
 {t:'h2',x:'Large spills: state reporting numbers'},
 {t:'p',x:'Call the operations manager or owner first. There are laws that require some spills to be reported to the state, depending on how much spilled, and they will handle the report. If you cannot reach either of them and the spill is large, reaches water or a drain, or you cannot control it, call 911, then the number for the state you are in.'},
 {t:'kv',items:[['Idaho','State Communications, 1-800-632-8000 or (208) 846-7610'],['Montana','406-431-0411 (initial notification), or Montana DEQ enforcement at (406) 444-0379'],['Wyoming','307-777-5885 (initial notification), or Wyoming DEQ at 307-777-7937'],['Federal','National Response Center, 1-800-424-8802']]},
 {t:'h2',x:'Tickets, fines, and violations'},
 {t:'p',x:'The driver is responsible for any traffic ticket, parking ticket, or fine received while driving, including in a company vehicle. Report every ticket to the operations manager within 24 hours.'},
 {t:'p',x:'Violating this policy can lead to discipline, up to and including loss of driving privileges or termination. Serious violations, such as driving impaired, using a handheld phone while driving, or a pattern of unsafe driving, may mean immediate termination. Repeated or serious violations may also affect the driver\'s insurance approval.'}]},
{id:'card',title:'Company Credit Card Policy',version:'Nov 4, 2026',sub:'What the card is for, receipts, and misuse',
 ack:'I have read and understand the Prominent Pest and Wildlife Company Credit Card Policy, and I agree to follow it. I understand that I may only use the card for gas and approved job needs, and that misuse can lead to discipline, up to and including termination.',
 blocks:[
 {t:'h2',x:'Purpose'},
 {t:'p',x:'The company credit card is a trust. We give it to employees so they can keep jobs moving, and it is for company business only. Do not use it for personal purchases, and never take money from the company.'},
 {t:'h2',x:'What the card is for'},
 {t:'p',x:'The card is for gas for company vehicles. We also understand that things come up on the job and need to be bought at the last minute, such as chemicals, gloves, and other job supplies. You can buy those when a job needs them right then.'},
 {t:'h2',x:'When to ask first'},
 {t:'p',x:'For anything other than gas and last-minute job supplies, ask your supervisor before you buy. If you are not sure whether something is okay, ask. It is always fine to ask, and it is never okay to guess.'},
 {t:'h2',x:'Not allowed'},
 {t:'ul',items:['Personal purchases of any kind, including personal gas, food, or items for family or friends','Cash back or cash withdrawals','Lending the card to anyone, or sharing the card number','Buying things for yourself with the plan to pay the company back later','Using the card to buy gas for a personal vehicle']},
 {t:'h2',x:'Receipts and records'},
 {t:'ul',items:['No receipt is needed for gas.','For anything other than gas, get a receipt and keep it in the vehicle.','For any purchase that was not gas, tell your supervisor what you bought and why, the same day.']},
 {t:'h2',x:'Lost or stolen card, and misuse'},
 {t:'p',x:'If the card is lost or stolen, tell your supervisor or the owner right away so it can be shut off.'},
 {t:'p',x:'Using the card for anything not allowed in this policy, or taking money from the company, is theft. It can lead to discipline, up to and including termination. We may also require you to repay the company, and we may report theft to the police.'}]},
{"id":"handbook","title":"Employee Handbook","version":"2026 Edition","hb":true,"sub":"Our policies, pay, time off, safety and conduct rules","pdf":"employee-handbook-2026.pdf","ack":"By my signature below, I acknowledge that I have received a copy of this Employee Handbook. I also acknowledge that I have read it, understand it, and agree to follow the policies and procedures in it.","blocks":[{"t":"h2","x":"Section 1: Welcome"},{"t":"p","x":"Welcome. We are thrilled to have you join us. We are committed to teamwork and to helping everyone here succeed. One way to ensure your success is to read and understand this handbook. It is a ready reference and a summary of our personnel policies, work rules and benefits. If you have questions, please speak with your Supervisor."},{"t":"h3","x":"Right to Revise"},{"t":"p","x":"This handbook highlights our policies, practices and benefits for your information. It is not a binding contract between the Company and its employees. We reserve the right to revise, delete or add to any policy, procedure, work rule or benefit in this handbook, in our discretion and consistent with applicable law. You will be informed when policies, procedures, work rules or benefits are revised. The Company also reserves the right to interpret the policies in this handbook. Please keep this handbook readily available and insert updated material promptly so that it stays current."},{"t":"h3","x":"Violation of Policies"},{"t":"p","x":"A violation of any policy, whether or not it is detailed in this handbook, may result in disciplinary action, up to and including termination. Nothing in this handbook is intended to restrict any right guaranteed to employees by Section 7 of the National Labor Relations Act, including the right to engage in concerted activity for mutual aid or protection, or any other right under applicable federal, state or local law. Nothing in this handbook will be interpreted, applied or enforced to interfere with, restrain or coerce employees in the exercise of those rights."},{"t":"h3","x":"Employment Relationship"},{"t":"p","x":"Except where state law provides otherwise (see the Montana provisions in Section 12), your employment with the Company is at-will. This means that employment is not for any specified period and may be ended by you or by the Company at any time, with or without cause or advance notice. The Company also reserves the right to change an employee’s position, in its discretion and consistent with applicable law, with or without cause or advance notice, through actions other than termination, including demotion, promotion, transfer, reclassification or reassignment. The Company also reserves the right to use its managerial discretion in imposing any form of discipline it considers appropriate."},{"t":"p","x":"No person other than the President of the Company has the authority to agree to anything contrary to this policy. Any such agreement must be in writing and signed by the President of the Company."},{"t":"h3","x":"Equal Employment Opportunity"},{"t":"p","x":"We are an equal opportunity employer. Every employee has the right to work in an environment free from unlawful discrimination, harassment and retaliation. Employment decisions for all applicants and employees are made without regard to race, color, religion or creed, sex (including pregnancy, childbirth and related conditions), sexual orientation, gender identity or expression, age, national origin or ancestry, citizenship status, genetic information, marital status, military or veteran status, physical or mental disability, or any other characteristic protected by federal, state or local law. This policy applies to all aspects of employment, including hiring, job assignment, compensation, promotion, benefits, training, discipline and termination."},{"t":"p","x":"We expect all employees to follow this policy and to take every step necessary to maintain a workplace free from unlawful discrimination, harassment and retaliation. If you believe a violation has occurred, please follow the Complaint Procedure in Section 2. The Company will investigate your concerns and take appropriate corrective action. The Company prohibits retaliation against anyone who raises a concern under this policy or cooperates in a related investigation."},{"t":"h2","x":"Section 2: Harassment-Free Workplace, Accommodations and Complaints"},{"t":"h3","x":"Discrimination and Harassment-Free Workplace"},{"t":"p","x":"We have a strict policy against discrimination and harassment of any type. Our goal is a work environment free from harassment. Harassment is offensive, violates our policy and can be unlawful. Conduct prohibited by this policy is unacceptable in the workplace and in any work-related setting, such as business trips, business meetings and business-related social events. The policy covers the conduct of any employee, intern, volunteer, applicant, contractor, or any person who has a business, service or professional relationship with us. We prohibit harassment or discrimination on the basis of race, color, religion or creed, sex (including pregnancy), sexual orientation, gender identity, age, national origin, citizenship status, genetic information, marital status, military or veteran status, disability, or any other characteristic protected by federal, state or local law."},{"t":"p","x":"Harassing conduct that uses electronic communication devices or media, such as email, text messages or social media, is a serious offense and violates this policy."},{"t":"h3","x":"Sexual Harassment"},{"t":"p","x":"We prohibit every form of harassment based on a legally protected characteristic, including sexual harassment. Sexual harassment includes unwanted physical or verbal conduct that directly or indirectly affects a term or condition of employment or creates an intimidating, hostile or offensive working environment."},{"t":"p","x":"Specifically, we prohibit unwelcome sexual advances, requests for sexual favors, and other verbal, visual or physical conduct of a sexual nature when:"},{"t":"ol","items":["submission to the conduct is made, explicitly or implicitly, a term or condition of employment;","submission to or rejection of the conduct is used as the basis for employment decisions affecting the individual; or","the conduct has the purpose or effect of unreasonably interfering with an individual’s work performance or creating an intimidating, hostile or sexually offensive working environment, even if there are no tangible or economic job consequences."]},{"t":"p","x":"Examples of behavior that may violate this policy:"},{"t":"ul","items":["Making sexually suggestive comments, jokes or advances, or offering employment benefits in exchange for sexual favors.","Touching any part of an employee’s body after that person has indicated, or it is known, that the contact is unwelcome.","Sending sexually related, sexually derogatory or sexually suggestive text messages, videos or social media messages.","Posting, passing around or displaying sexually suggestive or obscene printed materials, images, posters, cartoons, objects or websites.","Making derogatory comments about an employee’s gender, gender identity, sexual activity, sexual orientation, body or dress.","Verbal abuse or joking about an employee’s gender characteristics, such as vocal pitch, facial hair, or the size or shape of the body.","Physical or verbal abuse concerning an employee’s gender or the perception of the employee’s gender.","Making or threatening retaliatory action after receiving a negative response to sexual advances.","Degrading comments that stereotype how people of a particular sex should look or act."]},{"t":"p","x":"Sexual harassment includes gender-based harassment even when it is not sexual in nature, and it can involve conduct or language by someone of the same sex as the victim. These examples are illustrative, not exhaustive."},{"t":"h3","x":"Other Forms of Harassment"},{"t":"p","x":"Harassment based on any other protected characteristic is also strictly prohibited. Prohibited harassment is verbal, visual or physical conduct that denigrates or shows hostility or aversion toward a person because of a protected characteristic and that (1) has the purpose or effect of creating an intimidating, hostile or offensive work environment, (2) has the purpose or effect of unreasonably interfering with the person’s work performance, or (3) otherwise adversely affects the person’s employment opportunities. Examples include:"},{"t":"ul","items":["Racial slurs or epithets, and racial jokes.","Unwanted or unwelcome physical contact.","Displaying, storing or transmitting offensive or harassing materials at work or on Company equipment or facilities.","Bullying.","Threatening, intimidating or hostile acts, negative stereotyping, and denigrating jokes.","Displaying or circulating written or graphic material that denigrates or shows hostility or aversion toward an individual or group, including through email."]},{"t":"p","x":"These examples are illustrative, not exhaustive. Sexual harassment is a form of sex discrimination in violation of federal and state law. In addition, abusive conduct, meaning conduct by an employer or employee in the workplace, done with malice, that a reasonable person would find hostile, offensive and unrelated to the Company’s legitimate business interests, will not be tolerated."},{"t":"h3","x":"Disabilities"},{"t":"p","x":"We comply with all applicable federal and state laws on disability. We do not discriminate against any qualified employee or applicant in any term or condition of employment because of a disability, a perceived disability or a record of disability. We will provide reasonable accommodations to qualified individuals with a disability who have made us aware of the disability and the need for accommodation, unless the accommodation would cause an undue hardship for the Company. This policy covers all aspects of employment, including recruitment, hiring, compensation, discipline, termination and access to benefits and training."},{"t":"p","x":"If you believe you need a reasonable accommodation to perform the essential functions of your job, please contact the Office Manager. We encourage you to make the request in writing, although a verbal request is also sufficient. We decide accommodations case by case, through an individualized assessment and an interactive discussion with you. The Company prohibits retaliation against any employee for requesting a reasonable accommodation. If you believe this policy has been violated, please follow the Complaint Procedure."},{"t":"h3","x":"Pregnancy and Lactation Accommodations"},{"t":"p","x":"The Company provides reasonable accommodations for pregnancy, childbirth and related medical conditions. Depending on your needs, accommodations may include:"},{"t":"ul","items":["Frequent, longer or flexible restroom breaks.","Changes to food and drink policies.","Alternative or more frequent seating.","Temporary lifting or duty restrictions supported by your health care provider.","Schedule changes or time off for medical appointments and recovery."]},{"t":"p","x":"Other accommodations may be available unless they would cause an undue hardship for the Company. Please contact the Office Manager and describe the accommodation you are requesting. The Company prohibits retaliation against employees who request a pregnancy-related accommodation. See Section 4 for our lactation policy."},{"t":"h3","x":"Religious Accommodations"},{"t":"p","x":"The Company is committed to a work environment that respects the religious beliefs of all employees. We will make good-faith efforts to provide a reasonable accommodation to employees whose sincerely held religious beliefs conflict with a Company employment requirement, unless the accommodation would cause an undue hardship for the Company. To request an accommodation, contact the Office Manager and provide:"},{"t":"ul","items":["a description of the requested accommodation; and","the reason for the request."]},{"t":"p","x":"The Company prohibits retaliation against employees who request a religious accommodation or who participate in an approved accommodation."},{"t":"h3","x":"Complaint Procedure"},{"t":"p","x":"All employees share responsibility for a positive work environment. We cannot prevent or correct problematic conduct unless we know about it. If you believe you have been the victim of, or have witnessed, harassment, sexual harassment, discrimination or retaliation, please act right away:"},{"t":"ol","items":["If you are comfortable doing so, tell the person whose behavior is bothering you to stop.","If you are not comfortable speaking with that person, or the behavior continues after you asked them to stop, report your concerns to your Supervisor, the Office Manager or any higher member of management. You may skip any person who is involved in the conduct."]},{"t":"p","x":"A qualified person will conduct a prompt, thorough and objective investigation. It may include interviews with the people involved and with anyone who may have seen the conduct or has other relevant knowledge. All employees are expected to cooperate. When the investigation is complete and where warranted, we will take appropriate corrective action, which may include training, counseling, reassignment or other discipline. We will keep the investigation and any resulting action as confidential as possible, consistent with a fair investigation and appropriate corrective action. If the conduct continues, please report it again immediately."},{"t":"p","x":"This procedure does not limit your right to file a charge or complaint with a government agency, such as the U.S. Equal Employment Opportunity Commission or the human rights agency in your state."},{"t":"h3","x":"Non-Retaliation"},{"t":"p","x":"Supervisors, managers, co-workers and third parties such as vendors or customers may not retaliate against anyone who has complained about harassment, discrimination, retaliation or abusive conduct, or who has taken part in an investigation, proceeding or hearing based on such a complaint. If you believe you have been retaliated against, please follow the Complaint Procedure."},{"t":"h2","x":"Section 3: Employment Basics"},{"t":"h3","x":"Employee Classifications"},{"t":"p","x":"Exempt employees receive a fixed salary regardless of the hours they work in a week and hold executive, administrative, professional or other jobs that meet the legal tests for exemption. Exempt employees are not eligible for overtime."},{"t":"p","x":"Non-exempt employees are paid for all hours worked, are eligible for overtime and are subject to federal and state wage and hour requirements."},{"t":"p","x":"Temporary employees are hired for a limited period (for example, seasonal employees) or for a specific project. They are not eligible for any benefits other than those required by law."},{"t":"p","x":"Your classification will be explained to you when you are hired or when your position changes."},{"t":"h3","x":"Personal Appearance"},{"t":"p","x":"You are expected to wear neat, clean clothing and to dress appropriately for the work you do and for our business presentation needs. When we require a uniform as a condition of employment, we will provide it."},{"t":"p","x":"At a minimum, work attire must not pose a safety hazard to the wearer or others, must not be overly distracting to the workforce, and must not contain offensive graphics or slogans. If you are inappropriately dressed, you may be sent home to change. Non-exempt employees are not paid for the time lost. Hair must be neat, clean and combed. Facial hair is allowed if it is well groomed, no longer than ½ inch, and does not interfere with the safe use of required protective equipment. We will consider requests for exceptions based on religion, disability or other legally protected reasons. Please contact the Office Manager."},{"t":"h3","x":"Fitness for Duty"},{"t":"p","x":"We may require a physical examination, at our expense, when it is job-related and consistent with business necessity, such as to confirm that you can perform the essential functions of your job, or when required by law or regulation."},{"t":"h3","x":"Paydays and Pay Periods"},{"t":"p","x":"Our workweek runs Sunday through Saturday. You are paid in full every other Wednesday. Each pay period covers the previous two workweeks (Sunday through Saturday). When a regular payday falls on a holiday, paychecks are issued on the last regular workday before the holiday. If we change the payday schedule, we will give you at least seven calendar days’ advance notice."},{"t":"p","x":"If you have a question about your paycheck, tell your Supervisor or the Office Manager. We will correct any error as soon as possible and no later than the following check. If you want someone else to pick up your paycheck, you must give payroll written authorization each time."},{"t":"h3","x":"Required Deductions from Pay"},{"t":"p","x":"We withhold the deductions required by state and federal law from your gross wages. These include federal and state income tax (where applicable), Social Security and Medicare (FICA), court-ordered garnishments or wage assignments, IRS or state tax agency orders to withhold, and other deductions required by law. We take other deductions only when you have authorized them in writing or the law allows them. All deductions and their amounts are listed on your pay stub."},{"t":"p","x":"Paychecks of exempt employees will not be docked or reduced except in the limited circumstances the law allows. If you believe an improper deduction has been made, report it to the Office Manager right away and we will review it and reimburse any improper amount."},{"t":"h3","x":"Salary and Wage Advances"},{"t":"p","x":"As a practice, we do not grant salary or wage advances. Exceptions are made only in extreme circumstances."},{"t":"h2","x":"Section 4: Wage and Hour Guidelines for Non-Exempt Employees"},{"t":"p","x":"The workday is a 24-hour period that begins at 12:00 a.m. and ends at 11:59 p.m. You will be paid for all hours worked. Pay is calculated from the time you clock in for work until you are released from duty and clock out."},{"t":"h3","x":"Rest Periods"},{"t":"p","x":"As a Company policy, non-exempt employees may take one paid 10-minute rest break for every four hours worked (or major fraction of four hours, meaning more than two hours). A rest break is not provided when total daily work time is less than three and one-half hours. You do not clock out for rest breaks and you are paid for them. If you believe you are unable to take an authorized rest or meal period, speak with your Supervisor, who will make sure you get one."},{"t":"h3","x":"Lactation"},{"t":"p","x":"If you need to express breast milk for your nursing child during the workday, you will be given reasonable break time each time you need it, for up to one year after the child’s birth. We will provide a private space, other than a bathroom, that is shielded from view and free from intrusion by co-workers and the public. Where possible, the break runs at the same time as a rest break you already receive. Time that exceeds your paid rest break time is unpaid unless you are performing work during it. Please talk to the Office Manager so we can make arrangements."},{"t":"h3","x":"Meal Periods"},{"t":"p","x":"Whenever you work more than five hours in a workday, you are authorized and expected to take an uninterrupted meal period of at least 30 minutes, during which you are relieved of all duty and free to leave the premises. Meal periods are unpaid. You must clock out and back in for your meal period, and failing to do so may lead to discipline. Please take your meal period before you complete your fifth hour of work. You are also authorized to take a second uninterrupted, duty-free 30-minute meal period when you work more than 10 hours in a workday."},{"t":"p","x":"If you cannot take your meal period, or you are required to work during it, tell your Supervisor as soon as possible. You will be paid for any meal period time during which you perform work."},{"t":"h3","x":"Time Clock and Time Cards"},{"t":"p","x":"The Company does not provide phones. If you are paid hourly, you must clock in and out using FieldRoutes on your own phone, and you are responsible for your own time clock. Non-exempt employees may not perform any work without recording their time (“working off the clock”). All time records must be complete and accurate. You are responsible only for your own time clock: you may not change anyone else’s time record or allow anyone else to manage yours."},{"t":"p","x":"Mistakes on your time clock. If you make a mistake on your time clock, such as forgetting to clock in or out, clocking at the wrong time, or any other error, you must report it to your Supervisor as soon as you notice it. Your Supervisor will correct the record so that you are paid for all time actually worked. Reporting a mistake promptly will not result in discipline. Failing to report a known mistake may."},{"t":"p","x":"Time audits. The Company reserves the right to audit time records, including clock-in and clock-out entries and related work records, whenever it suspects time theft or inaccurate time reporting. Time theft includes recording time you did not work, clocking in or out for someone else, and leaving work or running personal errands while on the clock. Falsifying time records or time theft is a serious violation and may result in discipline up to and including termination. Any adjustment to pay following an audit will be made as applicable law allows."},{"t":"p","x":"You will not be paid for your normal commute between your home and our shop. If you report to the shop to get tools or equipment before your first job site, clock in when you arrive at the shop and begin working. If you are not required to report to the shop before your first job site, you will be paid for travel time from your home to your first site. In that case, clock in when you leave home and clock out when you arrive back home. Under the Company’s vehicle policy, you may not use a Company vehicle for personal stops or personal activities during this time. Contact your Supervisor if you have questions about travel time."},{"t":"p","x":"You must attest that the hours you recorded are accurate and are the total hours you worked. Do not sign off on a time card that is inaccurate, and tell your Supervisor immediately if anything needs to change. If you believe you were not paid for all time worked, report it to your Supervisor or the Office Manager. We will not retaliate against you for doing so."},{"t":"h3","x":"Overtime Pay"},{"t":"p","x":"You will be paid one and one-half times your regular rate of pay for all time worked over 40 hours in a workweek. You must have prior approval before working overtime, and you are expected to cooperate with Company requests to work overtime. All overtime that is worked will be paid, even if it was not approved; working unapproved overtime may result in discipline. Overtime pay will not be duplicated or pyramided, meaning no premium rate is paid more than once for the same hours worked."},{"t":"h2","x":"Section 5: Benefits"},{"t":"p","x":"Paid Time Off (PTO) and paid holidays are available to salaried employees only, as described below. Hourly and seasonal employees do not receive PTO."},{"t":"kv","items":[["Paid Time Off: who is eligible","Salaried employees. Hourly and seasonal employees do not receive PTO."],["Paid Time Off: how it accrues and the yearly amount","Two weeks (10 days) of paid time off each calendar year, available to use during that year."],["Paid Time Off: carryover or cap on accrued balance","Unused time does not carry over. PTO does not accrue or roll into the following year."],["Paid Time Off: payout of unused balance when employment ends","Unused PTO is not paid out when employment ends."],["Paid Time Off: how to request it and how much notice is needed","Request PTO in writing at least two weeks ahead. Requests are subject to Supervisor approval."],["Paid holidays observed","Five paid holidays: New Year’s Day, Independence Day (July 4), Labor Day, Thanksgiving Day and Christmas Day."],["Holiday pay rules for non-exempt employees","Paid holidays apply to salaried employees. Hourly and seasonal employees are not paid for holidays."]]},{"t":"h2","x":"Section 6: Leave of Absence and Time Off"},{"t":"h3","x":"Jury Duty and Court Service"},{"t":"p","x":"If you receive a notice to report for jury duty, tell your Supervisor right away. We will not discharge, threaten or penalize you for serving. If you are a non-exempt employee, time spent on jury duty or a court appearance is unpaid. Exempt employees are paid in accordance with state and federal law. Please show proof of jury service and the amount of jury pay you are entitled to. On any day you are excused from jury service early enough to return to work for at least one-half of your regular shift, you are expected to report to work."},{"t":"h3","x":"Military Service"},{"t":"p","x":"Leave is provided when you enter service in the armed forces of the United States or the reserves or National Guard. Military leave is unpaid except as required by law. You have reemployment rights and keep full seniority benefits for prior service under the Uniformed Services Employment and Reemployment Rights Act (USERRA) and applicable state law, provided you meet the legal requirements and return to work or apply for reemployment within the time the law allows."},{"t":"h3","x":"Family and Medical Leave (FMLA)"},{"t":"p","x":"Where the Company is covered by the federal Family and Medical Leave Act and you are eligible, you may take up to 12 weeks of unpaid, job-protected leave in a 12-month period (up to 26 weeks for military caregiver leave) for qualifying family and medical reasons. To be eligible you must have worked for the Company for at least 12 months and at least 1,250 hours in the past 12 months, and work at a location with at least 50 employees within 75 miles. Contact the Office Manager if you think you may qualify. Leave that does not qualify under the FMLA is handled under the policies below."},{"t":"h3","x":"On-the-Job Illness or Injury Leave"},{"t":"p","x":"If you suffer a work-related injury or illness, tell your Supervisor immediately. No matter how minor an injury seems, report it right away. Prompt reporting is critical to qualify for workers’ compensation benefits. Neither the workers’ compensation insurer nor the Company is responsible for benefits for an injury that arises from your voluntary participation in an off-duty recreational, social or athletic activity that is not part of your work duties. Workers’ compensation fraud is cause for immediate termination. We will not retaliate against you for filing a legitimate workers’ compensation claim."},{"t":"h3","x":"Medical Leave of Absence (Not Covered by FMLA)"},{"t":"p","x":"You may be granted a leave of absence for a personal illness, injury or other disabling condition. We may approve or deny a request for leave in accordance with applicable law. We consider our operational needs, your reason for leave, your job performance, the requested length of leave and your length of employment. We may require a note from a health care provider to support your request and, before you return to work, a note stating you are medically able to return. We will also consider leave as a reasonable accommodation where the law requires."},{"t":"h3","x":"Personal Leave of Absence"},{"t":"p","x":"We will consider written requests for unpaid leave for personal reasons, not to exceed five days in a 12-month period. Regular employees are eligible after six continuous months of employment. You must give at least 30 days’ notice except in an emergency. Personal leave is granted at the Company’s discretion and only when you have no other leave available. It is unpaid and without benefits. After an approved personal leave, there is no guarantee that you will return to your former position or any position, except as the Company agrees or the law requires."},{"t":"h3","x":"Leave for Victims of Domestic Violence, Sexual Assault or Stalking"},{"t":"p","x":"Leave may be available to you to get services or treatment relating to domestic violence, sexual assault or stalking of yourself or a family member, as state law defines it. Purposes include medical care, counseling, legal advice, law enforcement assistance and other steps to help ensure your health and safety. Leave is provided for a reasonable amount of time, is unpaid, and you may choose to use accrued PTO. We also provide reasonable safety accommodations on request, in accordance with applicable law."},{"t":"h3","x":"Military Spousal Leave"},{"t":"p","x":"You may take up to 15 days of unpaid leave before your spouse’s deployment, or while your spouse is on leave from deployment, during a period of military conflict. To qualify:"},{"t":"ul","items":["Your spouse must be a member of the Armed Forces deployed during a period of military conflict to an area designated as a combat theater or combat zone by the President of the United States, or a member of the National Guard or Reserves ordered to active duty and deployed during a period of military conflict.","You must be employed for an average of 20 or more hours per week.","You must tell us you intend to take the leave within two business days of receiving official notice that your spouse will be on leave from deployment.","You must give us written documentation certifying that your spouse will be on leave from deployment during the requested leave time."]},{"t":"p","x":"Leave under this policy is granted in accordance with applicable law, provided all legal requirements are satisfied."},{"t":"h2","x":"Section 7: Integrity"},{"t":"h3","x":"Open Door Policy"},{"t":"p","x":"We are committed to open and honest communication in the workplace, and we want to hear your concerns, problems and suggestions. The easiest and most effective way to find a solution is usually an honest conversation with your Supervisor. Please follow the usual reporting channels, starting with your immediate Supervisor or the Office Manager. If you would rather not discuss the matter with a particular person, go to the next level of management, without fear of reprisal. This policy does not prevent, limit or delay the Company from taking appropriate disciplinary action when it considers it appropriate."},{"t":"h3","x":"Conduct"},{"t":"p","x":"We place a high value on teamwork and ethical conduct. We follow the laws and regulations that govern our business and we expect you to do the same. Please conduct yourself in a way that does not embarrass or discredit our good reputation. You represent us, and the community’s impression of you is often its impression of the whole organization. Please be courteous, tactful and fair with co-workers, vendors and customers. Regardless of classification, status or length of service, you are expected to meet our standards for job performance and behavior."},{"t":"p","x":"We may respond to departures from proper conduct or violations of Company rules with verbal or written warnings, suspension without pay, demotion, discharge or any other action we consider appropriate. Discipline depends on the circumstances of each case and will not necessarily follow any particular sequence. Subject to Section 12 (Montana), the Company may discharge an employee immediately whenever it determines that action is appropriate."},{"t":"p","x":"The following are examples of conduct that violates our standards. The list is not complete and does not limit the Company’s right to impose discipline for other conduct:"},{"t":"ul","items":["Conduct that endangers the safety or well-being of any employee or other person on Company premises.","Falsifying any employment document, or knowingly filing a false workers’ compensation or harassment claim.","Gambling, carrying unauthorized weapons or explosives, or violating criminal laws.","Fighting, throwing objects, horseplay, practical jokes, threats of violence or violence.","Dishonesty, fraud, theft or sabotage.","Posting harassing, threatening, slanderous or malicious content on social media.","Threatening, intimidating, coercing, using abusive or vulgar language, or interfering with other employees’ work.","Insubordination, refusing to follow instructions, or failing to perform assigned duties.","Damaging, misusing, losing or destroying Company property through unauthorized use or careless or willful acts.","Lack of teamwork, poor communication, unprofessional conduct, or other conduct that is improper for the workplace.","Performance that does not meet the requirements of the position, including unauthorized or excessive absences or tardiness.","Sexual or other harassment or discrimination.","Unauthorized use or disclosure of the Company’s business secrets, confidential financial data or other confidential information.","Violating the Drug-Free Workplace Policy.","Other circumstances that we determine warrant corrective action."]},{"t":"p","x":"Violations of any Company policy may lead to discipline, up to and including termination."},{"t":"h3","x":"Attendance"},{"t":"p","x":"We understand that you may sometimes be unable to come to work because of illness or an emergency. If you must be late or absent for a good reason, arrange it in advance with your Supervisor. If that is not possible, call or text your Supervisor at least 30 minutes before the start of your workday. Always give the reason for your late arrival or absence and your expected return date. If you text and do not get a response within 10 minutes, call your Supervisor directly. If your Supervisor is unavailable, call the Office Manager. If you want to leave work during the workday for any reason, you must get your Supervisor’s approval first. Absences protected by law, such as approved leave under Section 6, will not be counted against you."},{"t":"h3","x":"Drug-Free Workplace Policy"},{"t":"p","x":"Use of alcohol or illegal drugs on the job harms work performance, efficiency, safety and health, and the well-being of others. Our workforce and workplace must be free of illegal drugs and alcohol."},{"t":"p","x":"“Illegal drug” means any drug that (a) is not legally obtainable, (b) is legally obtainable but has not been legally obtained, or (c) is legal under state law but illegal under federal law. It includes prescription drugs that were not legally obtained and prescription drugs not used for the prescribed purpose, by the person prescribed them, or in the prescribed amount. Marijuana remains illegal under federal law even though it may be legal in some states where we operate. For purposes of this policy, using, possessing or being under the influence of marijuana at work, on Company property, in a Company vehicle or while performing Company business is prohibited, and the Company does not accommodate medical marijuana use at work. Where state law protects lawful off-duty use of marijuana, alcohol or tobacco (see Section 12), we will not discipline you for lawful use off the premises during non-working hours unless the law allows it, for example because the use affects your ability to do your job or creates a safety risk."},{"t":"p","x":"We prohibit the following:"},{"t":"ul","items":["Possessing, using or working under the influence of alcohol or an illegal or unauthorized drug.","Distributing, selling, dispensing, manufacturing, transferring or purchasing illegal drugs.","Driving a Company vehicle at any time, or a personal vehicle on Company business, while under the influence of alcohol or an illegal drug.","Using, or working under the influence of, any controlled substance, including a lawfully prescribed drug, if the use or influence may affect the safety of co-workers or the public, your job performance, or the safe and efficient operation of our business."]},{"t":"p","x":"If your lawful use of a drug may create a safety risk, tell the Office Manager. You do not have to disclose the medical condition. We will reasonably accommodate qualified employees with disabilities as the law requires."},{"t":"p","x":"If you have a chemical dependency, we encourage you to seek treatment. If you want help, you may request an unpaid treatment or rehabilitation leave. No employee who comes forward voluntarily for help before it affects their performance or conduct will be disciplined solely for seeking assistance. If you violate this policy, we may bring the matter to the attention of law enforcement."},{"t":"p","x":"Reasonable suspicion testing. You will be tested for drugs or alcohol if reasonable suspicion exists that your ability to work safely may be impaired, that you show signs of impairment at work, or that you have possessed, distributed, dispensed, manufactured or used illegal drugs or alcohol at the workplace. You will not be allowed to work until we receive the results. Time you spend taking a test at our direction is paid time for non-exempt employees."},{"t":"p","x":"Post-accident testing. We may test after a serious accident or injury when the Company determines that you caused or contributed to it and that drugs or alcohol could reasonably be a contributing factor. We do not use testing to discourage or punish the reporting of an injury or illness."},{"t":"p","x":"Limits under state law. Some states limit who may be tested and when. We will test only as applicable law allows, and testing is done under a written procedure that complies with state law."},{"t":"p","x":"Consequences. If you test positive, have alcohol present at the levels we set, refuse to test, or fail to complete the testing process, you are subject to discipline up to and including immediate suspension and termination. A specimen that is diluted or lacks temperature readings is treated as a failed test. Employees who test positive and are offered an opportunity to return to work will be required to submit to testing on return and may be subject to unscheduled testing."},{"t":"p","x":"Confidentiality. Records of drug and alcohol tests are confidential and will not be disclosed without your prior written consent, a court order, or as otherwise required by law."},{"t":"h3","x":"Workplace Violence"},{"t":"p","x":"We are committed to preventing workplace violence and keeping a safe work environment. We expect all employees to treat each other and our customers, vendors and others with courtesy and respect at all times. We do not tolerate threats or acts of violence. This includes physical conduct such as violence, fighting, bullying or other conduct dangerous to others, and verbal conduct such as vulgar or abusive language, threats, intimidation or coercion aimed directly or indirectly at any employee or any person doing business with us. We treat comments or jokes about violence as serious."},{"t":"p","x":"Report, without fear of retaliation, any condition you believe poses a safety, health or security risk, including suspicious people or activities. Be as specific and detailed as possible. We will investigate promptly and thoroughly and take appropriate corrective action. If immediate action is needed, call 911. Do not put yourself in danger."},{"t":"h3","x":"Weapons"},{"t":"p","x":"To help keep employees and guests safe, unauthorized weapons are prohibited on Company property, including Company vehicles. Employees may not carry unauthorized weapons of any kind while performing Company business away from the property. Company property includes buildings and lots, offices, desks, lockers and Company vehicles. Any weapon the Company requires for your work must be authorized in writing by management. This policy applies to the extent allowed by applicable state law."},{"t":"h3","x":"Confidential Information"},{"t":"p","x":"Our customer lists, pricing information, business strategy, future plans, marketing plans, financial information, procedures and manuals, product and service designs, and business records are valuable proprietary and confidential assets of the Company. Maintaining their confidentiality is vital to our competitive position. Use this information only for Company business, safeguard it, disclose it only when authorized and only to those with a legitimate business need to know, and do not access or use information you have not been authorized to use. If confidential information is disclosed by mistake, tell your Supervisor immediately. If you are unsure whether information is confidential, check with your Supervisor before sharing it."},{"t":"p","x":"This duty applies on and off Company premises, during employment and after it ends, and to communications sent through Company systems."},{"t":"p","x":"Nothing in this policy prohibits you from discussing your own wages, hours or other terms and conditions of employment with co-workers or others, or from exercising any right protected by law, including reporting possible violations of law to a government agency. Under the federal Defend Trade Secrets Act, you will not be held criminally or civilly liable under any trade secret law for disclosing a trade secret in confidence to a government official or an attorney solely to report or investigate a suspected violation of law, or in a sealed filing in a lawsuit or other proceeding."},{"t":"h2","x":"Section 8: Technology, Company Property and Workplace Rules"},{"t":"h3","x":"Electronic Communication Devices and the Internet"},{"t":"p","x":"We provide electronic communication devices, equipment and technology, including telephones, email, voicemail, computers and the Internet. We may use surveillance equipment in the interior and exterior areas of our office buildings and shop. We do not place surveillance equipment in restrooms or other private areas."},{"t":"p","x":"Ownership of systems and data. All messages, materials, information, data and software created, transmitted, downloaded, received or stored on our computers or other electronic or telephone systems are our property. We reserve the right to monitor, retrieve and read any data composed, sent or received on our systems. Even when a message is erased or a website page is closed, it may still be possible to recreate the message or locate the site. Messages on these systems are business communications, not private employee communications, and you should have no expectation of privacy in them. Communications, including text and images, may be disclosed to law enforcement or other third parties without the consent of the sender or receiver. Do not consider Internet use or voice and electronic communications on Company property or equipment to be private. Passwords for Company systems must be made known to the appropriate representative so that we can access the system at any time, including when you are absent."},{"t":"p","x":"Authorized access. Access only the messages, files and programs you have permission to enter. We will not tolerate unauthorized review, copying, sharing, removal, damage or alteration of files, passwords, computer systems, programs, voicemail messages or other Company property, or improper use of information obtained without authorization. This includes customer data, trade secrets and personnel information."},{"t":"p","x":"Acceptable use. When you use the Internet, voicemail or email, you represent the Company. Use these systems in an effective, ethical and lawful way, primarily for business. All communications sent through Company systems must comply with this handbook, including the harassment, equal employment opportunity and confidential information policies. Company systems may not be used to send, retrieve, view or store communications that are discriminatory, harassing, obscene or threatening, or for any other illegal purpose or purpose against Company policy."},{"t":"p","x":"Employee responsibility. You are responsible for the content of all text, audio and images you place or send over the Internet. Messages must carry your own username and may not be sent under someone else’s name or an assumed name. If you wish to express personal opinions online, use your own account on other systems."},{"t":"p","x":"Software. Software and other material downloaded to Company computers may be used only in ways consistent with the licenses and copyrights of its owner. You must have our prior written authorization before introducing any software, including drivers, entertainment software or games, into the computer system. This protects against viruses. If you want software from the Internet, get approval from your Supervisor."},{"t":"p","x":"Email retention. Treat email and instant messages like other business records for retention purposes. Do not keep them longer than necessary. Consult our record retention guidelines or your Supervisor."},{"t":"h3","x":"Social Media"},{"t":"p","x":"Do not surf the web, check personal social media, shop online or play games for non-business purposes on Company computers, phones or other equipment during work time without prior approval. Work-related electronic communications and social networking must reflect our standards of professionalism. Do not use work-related social media tools (blogs, LinkedIn, Facebook and similar) unless you have been trained and approved."},{"t":"p","x":"Your social media activity is covered by all Company policies, including the equal employment opportunity, anti-harassment and confidential information policies. Do not post content that violates our discrimination or harassment policies or is threatening or obscene. Do not post video, images or material about Company employees that is libelous, harassing, bullying, discriminatory or retaliatory, or that can create a hostile work environment. Conduct that would not be allowed in the workplace is not allowed online, even outside working hours and on personal devices."},{"t":"p","x":"Get your Supervisor’s prior written approval before posting video, images or material about our competitors or customers, and before posting pictures or videos taken at a Company location, in uniform, or otherwise connected to the work environment. This does not apply to activity protected by law, such as photographing or recording health, safety or working-condition concerns, or other protected concerted activity."},{"t":"p","x":"Do not advertise or sell Company products or services on social media, or say that the Company has authorized you to speak on its behalf, without prior written approval from your Supervisor. If you post about the Company, including its services or products, say that you are an employee of the Company and that the views are your own. Do not post confidential or proprietary Company information (including financial information, trade secrets, customer lists, strategic plans and non-public business contracts) without your Supervisor’s prior written approval."},{"t":"h3","x":"Personal Property and Inspections"},{"t":"p","x":"To keep your valuables safe, leave them at home. Personal items such as coats, purses and lunches may be kept in your desk or a designated storage area. While you are on Company property, these items and other personal property may be inspected for safety, health, security or other legitimate reasons. Inspections will be conducted reasonably and respectfully. We are not responsible for personal items that are missing due to theft or carelessness."},{"t":"h3","x":"Unauthorized Removal, Use or Possession of Company Property"},{"t":"p","x":"Company property includes Company vehicles, maintenance and construction equipment and tools, office equipment, documents and files. It may be used only for authorized jobs and Company business, not for personal purposes. When using Company property, use care and good judgment, perform required maintenance, and follow all operating instructions, safety standards and guidelines. Tell your Supervisor right away if a vehicle or equipment appears damaged, defective or in need of repair; prompt reporting can prevent deterioration and injury. Neither you nor a friend or relative may remove or keep any Company property in your personal possession without approval from the Owner, President or a Manager. We reserve the right to notify the appropriate authorities of the names of individuals involved in unauthorized possession of Company property. You must return all Company property when your employment ends."},{"t":"h3","x":"Mobile Phones"},{"t":"p","x":"During working hours, you may use your personal phone only to clock in and out, to run FieldRoutes, and to use maps or navigation for your routes. You may also use it during a designated rest or meal period or in an emergency. Do not use it for anything else while you are working. Do not use any mobile communication device while driving on Company business, whether in a Company vehicle or your own. This includes hand-held and hands-free phones, laptops, pagers and text-messaging devices, and it includes sending, reading or writing text messages while driving. You may use a device while driving in an emergency, or in a vehicle that is lawfully pulled off or to the side of the road or stopped where it can safely remain stationary."},{"t":"p","x":"Do not use the camera on your cell phone or other wireless handheld device for non-business purposes at work. Non-exempt employees must have prior approval before using a mobile phone for business after regular work hours. If you do use a phone for business after hours, report that time to your Supervisor immediately so you are paid for it. The Company does not provide phones and does not pay for personal phones or phone service. Hourly field employees may use their own phones for FieldRoutes and maps, and you are responsible for your own phone and service. This will never reduce a non-exempt employee’s pay below the minimum wage or cut into required overtime pay."},{"t":"h3","x":"Personal Business at Work"},{"t":"p","x":"Take care of your personal affairs when you are not at work, including receiving personal mail, cashing personal checks and making personal calls. Do not make personal calls during working time except during breaks or in an emergency."},{"t":"h3","x":"Dating in the Workplace and Consensual Relationships"},{"t":"p","x":"Social relationships may develop in the workplace. To avoid any appearance of conflict of interest, influence or favoritism, employees who enter into a relationship must notify their Supervisor and review the policy prohibiting harassment. The Company will work with the employees to find a working solution. Each person must act in a completely professional manner, must not engage in offensive work behavior, and must make sure the relationship does not hurt their work performance."},{"t":"h3","x":"Employment of Relatives"},{"t":"p","x":"To avoid the appearance of nepotism, conflict of interest and favoritism, you may not be placed in a position where you are the immediate supervisor of, or have direct or indirect authority over, a family member. If you become related during employment, we may take action so that there is no reporting relationship. Relatives include an employee’s parent, child, spouse, registered domestic partner, sibling, in-laws and step relatives."},{"t":"h3","x":"Outside Employment"},{"t":"p","x":"We have no objection to you holding another job as long as you meet the performance standards for your job with us. Please think seriously about the effect extra work may have on your endurance, your health and your effectiveness. We hold all employees to the same standards of performance and scheduling and cannot make exceptions for employees who hold outside jobs. You may not solicit any customer to perform any work, service, installation or repair of the type our Company performs. To avoid this, talk with your Supervisor about any outside employment or activity that may present a conflict of interest."},{"t":"h2","x":"Section 9: On the Job"},{"t":"h3","x":"Promotions"},{"t":"p","x":"Where possible, it is our policy to promote qualified people from within. Open positions may be posted and may also be open to the public, and the Company may choose not to post a job opening internally. If you are promoted, you will have up to 30 calendar days to show that you can satisfactorily perform the full duties of the new position. If you do not perform satisfactorily in that time, you may be returned to your former position at the appropriate wage for that position."},{"t":"h3","x":"Personal Information"},{"t":"p","x":"It is your responsibility to tell your Supervisor or the Office Manager immediately of any change in your personal status, such as your telephone number, address or name. Accurate, timely information is important and is to your benefit."},{"t":"h3","x":"Personnel Files"},{"t":"p","x":"You may inspect your own personnel file at a reasonable time that is convenient for you and the Company, and you may take notes on any material in it. To do so, let your Supervisor know so an appointment can be scheduled. Materials in your personnel file will not be disclosed to anyone except people in the Company with a need to know, with your prior written authorization, in compliance with a lawfully served subpoena, or at the request of law enforcement agencies."},{"t":"h3","x":"Leaving Our Company"},{"t":"p","x":"We hope you will stay with us a long time. If you decide to resign, we ask that you give at least two weeks’ written notice stating your last day of work and the reason for your resignation. That date will be treated as the effective date of your resignation."},{"t":"p","x":"Your final paycheck will be available no later than the next regularly scheduled payday, regardless of the reason you leave the Company, or sooner if the law of your state requires it (see Section 12). You may pick it up at the office during normal business hours. If you have direct deposit and ask, your final paycheck may be deposited to your account on your final day. If you want it mailed, you must authorize the mailing and give the mailing address in writing."},{"t":"p","x":"We may schedule an exit interview so you can share your thoughts and experiences. Letters of reference generally are not given to employees. Exceptions may be made only with the written approval of management."},{"t":"h3","x":"On-the-Job Illness, Injury and First Aid"},{"t":"p","x":"If you are injured on the job or in the course of employment, report the following to your Supervisor immediately: the time of the accident, where it happened, the circumstances, a description of the injury, and any witnesses. Injuries that seem minor at the time can develop complications, so report all accidents to your Supervisor immediately, for your own protection."},{"t":"p","x":"Where state workers’ compensation law allows, you may choose, when you are hired or later in your employment, to be treated by your own pre-designated personal physician for an injury on the job (except in emergencies). To do so you must notify the Office Manager in writing, before the date of an injury, that this is your wish. “Personal physician” means your regular primary care physician or surgeon who has directed your medical treatment on previous occasions, who keeps your medical records, and who agrees to be pre-designated."},{"t":"h3","x":"Company Vehicles"},{"t":"p","x":"We may provide you with a vehicle for Company business. As a convenience to employees who have been granted a Company vehicle, they may drive it to and from home. No other personal travel is allowed. You must hold a valid driver’s license to operate a Company vehicle."},{"t":"p","x":"Observe all laws and safety guidelines when using a vehicle. Smoking is prohibited in Company vehicles at all times. The Company is not responsible for traffic citations you receive while driving on Company business. In general, you must report traffic accidents to the local police and to the Company. You may not sign or make any statement about who is at fault for an accident that happens while you are driving on Company business. Avoid explaining or describing the accident to anyone except public safety personnel, authorized Company personnel, or the insurance company’s claims adjuster or attorney."},{"t":"p","x":"Drivers and passengers in all vehicles used for Company business must wear safety belts. If you discover an inoperable safety belt, report it to your Supervisor promptly. A Company vehicle with an inoperable safety belt may not be used until it is repaired or replaced."},{"t":"p","x":"Distracted driving is a leading cause of motor vehicle accidents. The Company prohibits employees who drive on Company business from any activity that distracts them from driving, and follows all relevant federal and state rules on distracted driving, including those on mobile devices (see Mobile Phones in Section 8)."},{"t":"p","x":"We will stock vehicles with an adequate supply of parts, tools, equipment and supplies, which may be used only on authorized jobs. Each employee must account for the inventory of their vehicle. We are responsible for all necessary repairs and maintenance; bring any needed repairs to management’s attention as soon as possible. You are also responsible for keeping your vehicle clean and operational and for securing all Company tools, equipment and other property in the vehicle."},{"t":"h3","x":"Gasoline Credit Cards"},{"t":"p","x":"Gasoline credit cards are for the exclusive purpose of refueling Company vehicles. You may not buy food or other store items with the gas card unless your Supervisor has authorized it in advance."},{"t":"h3","x":"Hand Tools"},{"t":"p","x":"We provide tools for your use at Company-authorized job sites. They are not for personal use or for anything other than Company business. You are responsible for
