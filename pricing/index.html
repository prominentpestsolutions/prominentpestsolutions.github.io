<title>Pricing Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f2f4ee; --surface:#ffffff; --sunk:#e8ece2; --ink:#111410; --muted:#596052; --line:#d6dccd;
  --accent:#89c43e; --accent-ink:#0b0d09; --accent-soft:#e7f3d6; --ok:#4a7a17; --crit:#b3261e; --crit-soft:#f6d9d6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e100c; --surface:#181b15; --sunk:#0a0b08; --ink:#eef2ea; --muted:#9ba393; --line:#2a2f25;
  --accent:#8cc63f; --accent-soft:#25331a; --ok:#9fd65a; --crit:#ef7d72; --crit-soft:#3d1c19; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;flex:none}
.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;background:var(--sunk);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
input{min-height:44px}
textarea{resize:vertical;min-height:44px;line-height:1.35}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 240px;width:auto}
.meta{color:var(--muted);font-size:.9rem}
.sec{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sec h2{margin:0;background:var(--accent);color:var(--accent-ink);font:700 1.35rem/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;padding:12px 16px}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr);gap:4px 20px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.hd{background:var(--ink);color:var(--bg);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.svc b{display:block;font-weight:600}
.svc small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.val{white-space:pre-line;font-variant-numeric:tabular-nums}
.lbl{display:none;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.floor{color:var(--ok);font-weight:600}
@media (max-width:640px){
  .hd{display:none}
  .row{grid-template-columns:1fr 1fr}
  .svc{grid-column:1/-1}
  .lbl{display:block}
}
.foot{color:var(--muted);font-size:.9rem;text-align:center;margin-top:8px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.note{padding:10px 14px;border-radius:8px;background:var(--crit-soft)}
/* editor */
.ed{display:grid;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.ed:first-of-type{border-top:0}
.ed .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ed label{display:grid;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ed .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sech{display:flex;gap:8px;align-items:center;background:var(--accent);padding:10px 12px}
.sech input{font:700 1.2rem var(--display);letter-spacing:.04em;text-transform:uppercase;flex:1}
.pin{flex:1;display:grid;place-items:center}
.pin form{display:grid;gap:14px;width:min(100%,320px);text-align:center}
.pin input{text-align:center;font-family:var(--mono);font-size:1.8rem;letter-spacing:.4em}
.save{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}
@media print{.back,.bar,.top .btn{display:none!important} body{background:#fff}}
</style>
</head>

var app=document.getElementById('app');
var S={view:'view',data:null,err:'',q:'',pin:null,draft:null,busy:false,sheetUrl:''};
function api(fn){ var args=[].slice.call(arguments,1);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){ if(!r.ok) throw new Error('Server error '+r.status); return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'Something went wrong.'); return j.data; })
    .catch(function(e){ throw (e instanceof TypeError ? new Error('No connection. Check Wi-Fi or data.') : e); }); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function msg(e){ return (e&&e.message?e.message:String(e)).replace(/^Exception:\s*/,''); }
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(function(){el.hidden=true;},2800); }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function hl(t){ t=esc(t); if(!S.q) return t; var q=esc(S.q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return t.replace(new RegExp('('+q+')','gi'),'<mark>$1</mark>'); }
function header(right){ return '<a class="back" href="/">← All tools</a><div class="top"><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Pricing Guide</b><span class="eyebrow">Prominent Pest Solutions · Internal</span></div></div>'+(right||'')+'</div>'; }
function upd(u){ u=String(u||''); if(/GMT|\d{4}-\d\d-\d\dT/.test(u)){ var d=new Date(u); if(!isNaN(d)) return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); } return u; }
function groups(rows){ var out=[],m={}; rows.forEach(function(r,i){ var k=r.section||'Other'; if(!m[k]){ m[k]={name:k,rows:[]}; out.push(m[k]); } m[k].rows.push(r); }); return out; }

function vView(){
  var d=S.data, h=header('<button class="btn ghost sm" data-a="toPin">Edit prices</button>');
  if(S.err && !d) return h+'<div class="note">'+esc(S.err)+'</div>';
  if(!d) return h+'<div class="empty">Loading pricing…</div>';
  var q=S.q.toLowerCase();
  var rows=d.rows.filter(function(r){ return !q || [r.section,r.service,r.note,r.standard,r.floor].join(' ').toLowerCase().indexOf(q)>=0; });
  var body=groups(rows).map(function(g){
    return '<section class="sec"><h2>'+esc(g.name)+'</h2><div class="row hd"><div>Service</div><div>Standard Price / Guidelines</div><div>Floor (Minimum)</div></div>'+
      g.rows.map(function(r){ return '<div class="row"><div class="svc"><b>'+hl(r.service)+'</b>'+(r.note?'<small>'+hl(r.note)+'</small>':'')+'</div>'+
        '<div><span class="lbl">Standard</span><div class="val">'+hl(r.standard||'-')+'</div></div>'+
        '<div><span class="lbl">Floor</span><div class="val floor">'+hl(r.floor||'-')+'</div></div></div>'; }).join('')+'</section>';
  }).join('');
  return h+'<div class="bar"><input type="search" id="q" placeholder="Search services or prices" value="'+esc(S.q)+'" aria-label="Search">'+
    '<span class="meta">'+(d.updated?'Updated '+esc(upd(d.updated)):'')+'</span></div>'+
    (S.err?'<div class="note">'+esc(S.err)+'</div>':'')+
    '<div id="list" style="display:grid;gap:16px">'+(body||'<div class="empty">No services match “'+esc(S.q)+'”.</div>')+'</div>'+
    '<p class="foot">'+esc(d.footer)+'</p>';
}
function vPin(){
  return header('<button class="btn ghost sm" data-a="cancel">Cancel</button>')+
    '<div class="pin"><form id="pinForm"><span class="eyebrow">Manager PIN to edit prices</span><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">'+
    '<button class="btn primary" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Checking…':'Unlock')+'</button></form></div>';
}
function vEdit(){
  var secs=[]; S.draft.forEach(function(r,i){ var k=r.section; var g=secs.filter(function(s){return s.name===k;})[0]; if(!g){ g={name:k,idx:[]}; secs.push(g); } g.idx.push(i); });
  var html=secs.map(function(g,gi){
    return '<section class="sec"><div class="sech"><input data-sec="'+esc(g.name)+'" value="'+esc(g.name)+'" aria-label="Section name"></div>'+
      g.idx.map(function(i,pos){ var r=S.draft[i];
        return '<div class="ed"><div class="g">'+
          '<label>Service<input data-i="'+i+'" data-f="service" value="'+esc(r.service)+'"></label>'+
          '<label>Note (small text)<input data-i="'+i+'" data-f="note" value="'+esc(r.note)+'"></label></div><div class="g">'+
          '<label>Standard price<textarea rows="2" data-i="'+i+'" data-f="standard">'+esc(r.standard)+'</textarea></label>'+
          '<label>Floor (minimum)<textarea rows="2" data-i="'+i+'" data-f="floor">'+esc(r.floor)+'</textarea></label></div>'+
          '<div class="acts"><button class="btn sm" data-a="up" data-i="'+i+'"'+(pos===0?' disabled':'')+' aria-label="Move up">↑</button>'+
          '<button class="btn sm" data-a="down" data-i="'+i+'"'+(pos===g.idx.length-1?' disabled':'')+' aria-label="Move down">↓</button>'+
          '<button class="btn danger sm" data-a="del" data-i="'+i+'">Delete</button></div></div>';
      }).join('')+
      '<div class="ed"><button class="btn sm" data-a="add" data-sec="'+esc(g.name)+'">+ Add service to this section</button></div></section>';
  }).join('');
  return header('<button class="btn ghost sm" data-a="cancel">Done without saving</button>')+
    '<p class="meta">Edit any box, then tap <b>Save prices</b>. Use a new line inside a price box for a second line (e.g. Light / Heavy).'+
    (S.sheetUrl?' You can also edit the <a href="'+esc(S.sheetUrl)+'" target="_blank" rel="noopener">Pricing tab in Google Sheets</a>.':'')+'</p>'+
    html+'<button class="btn" data-a="addSec">+ Add section</button>'+
    '<div class="save"><span class="meta">Saving sets “Updated” to today.</span><div class="bar"><button class="btn sm" data-a="newPin">Change PIN</button><button class="btn primary" data-a="save"'+(S.busy?' disabled':'')+'>'+(S.busy?'Saving…':'Save prices')+'</button></div></div>';
}
function render(){ app.innerHTML=({view:vView,pin:vPin,edit:vEdit})[S.view](); if(S.view==='pin') document.getElementById('pinIn').focus(); }
function load(){ return api('getPricing').then(function(d){ S.data=d; S.err=''; store('pricingCache',JSON.stringify(d)); if(S.view==='view') render(); })
  .catch(function(e){ S.err=(S.data?'Showing saved copy — ':'Can\'t load pricing: ')+msg(e); if(S.view==='view') render(); }); }

app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ S.q=t.value; var pos=t.selectionStart; render(); var n=document.getElementById('q'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} return; }
  if(t.hasAttribute('data-i')){ S.draft[+t.getAttribute('data-i')][t.getAttribute('data-f')]=t.value; }
});
app.addEventListener('change',function(e){
  var t=e.target; if(t.hasAttribute('data-sec') && t.tagName==='INPUT'){ var old=t.getAttribute('data-sec'), nv=t.value.trim()||old;
    S.draft.forEach(function(r){ if(r.section===old) r.section=nv; }); render(); }
});
app.addEventListener('submit',function(e){
  e.preventDefault(); var pin=document.getElementById('pinIn').value; if(!pin) return;
  S.busy=true; render();
  api('pricingUnlock',pin).then(function(d){ S.busy=false; S.pin=pin; S.sheetUrl=d.sheetUrl; S.draft=(S.data?S.data.rows:[]).map(function(r){ return Object.assign({},r); }); S.view='edit'; render(); window.scrollTo(0,0); })
    .catch(function(err){ S.busy=false; render(); toast(msg(err)); });
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return; var a=b.getAttribute('data-a'), i=+b.getAttribute('data-i');
  function swap(j,k){ var t=S.draft[j]; S.draft[j]=S.draft[k]; S.draft[k]=t; }
  function sib(dir){ var sec=S.draft[i].section; for(var k=i+dir;k>=0&&k<S.draft.length;k+=dir){ if(S.draft[k].section===sec) return k; } return -1; }
  if(a==='toPin'){ S.view='pin'; render(); }
  else if(a==='cancel'){ if(S.view==='edit' && !confirmLeave()) return; S.view='view'; S.draft=null; render(); }
  else if(a==='up'||a==='down'){ var k=sib(a==='up'?-1:1); if(k>=0){ swap(i,k); render(); } }
  else if(a==='del'){ S.draft.splice(i,1); render(); }
  else if(a==='add'){ var sec=b.getAttribute('data-sec'), last=-1; S.draft.forEach(function(r,j){ if(r.section===sec) last=j; });
    S.draft.splice(last+1,0,{section:sec,service:'New service',note:'',standard:'',floor:''}); render(); }
  else if(a==='addSec'){ S.draft.push({section:'NEW SECTION',service:'New service',note:'',standard:'',floor:''}); render(); }
  else if(a==='newPin'){ var p=prompt('New 4–8 digit PIN for editing prices:'); if(p){ S.newPin=p.trim(); toast('New PIN will apply when you save.'); } }
  else if(a==='save'){ S.busy=true; render();
    api('pricingSave',S.pin,S.draft,'',S.newPin||'').then(function(d){ if(S.newPin){ S.pin=S.newPin; S.newPin=''; } S.busy=false; S.data=d; store('pricingCache',JSON.stringify(d)); S.view='view'; S.draft=null; render(); window.scrollTo(0,0); toast('Prices saved.'); })
      .catch(function(err){ S.busy=false; render(); toast(msg(err)); }); }
});
function confirmLeave(){ return confirm('Leave without saving your changes?'); }
try{ var c=store('pricingCache'); if(c) S.data=JSON.parse(c); }catch(_){}
render(); load();
})();
</script>
