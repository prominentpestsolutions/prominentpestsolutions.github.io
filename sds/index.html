<style>
:root{--bg:#f2f4ee;--surface:#fff;--sunk:#e8ece2;--ink:#111410;--muted:#596052;--line:#d6dccd;--accent:#89c43e;--accent-ink:#0b0d09;--accent-soft:#e7f3d6;--ok:#4a7a17;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
main{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
input{font:inherit;color:inherit;width:100%;min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sec{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sec h2{margin:0;background:var(--accent);color:var(--accent-ink);font:700 1.3rem/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;padding:12px 16px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none;min-height:56px}
.item:first-of-type{border-top:0}.item:active{background:var(--accent-soft)}
.item b{font-weight:600;font-size:1.05rem}.item small{color:var(--muted);font-size:.85rem;white-space:nowrap}
.item .acts{display:flex;gap:8px;flex:none}
.item .go{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;font:700 .9rem var(--body);color:var(--accent-ink);background:var(--accent);text-decoration:none;white-space:nowrap}
.item .go.lbl{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.item:active{background:inherit}
.note{color:var(--muted);font-size:.9rem;margin:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.full{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-weight:600;text-decoration:none;color:inherit;align-self:flex-start}
</style>
