<title>SDS Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@500;600&display=swap">
<style>
:root{--bg:#e8ece2;--bar:#111410;--bar-ink:#f2f4ee;--accent:#89c43e;--muted:#596052}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font:16px/1.4 "Barlow",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--bar);color:var(--bar-ink);
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--accent);color:#0b0d09;font-weight:600;text-decoration:none;flex:none}
h1{flex:1;min-width:0;margin:0;font:700 1.3rem/1.1 "Barlow Condensed",Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{color:var(--bar-ink);opacity:.8;font-size:.9rem;font-weight:600;flex:none;padding:8px 4px}
#pages{display:grid;gap:10px;justify-items:center;padding:12px 8px max(24px,env(safe-area-inset-bottom))}
canvas{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);max-width:100%;height:auto}
.msg{padding:40px 16px;text-align:center;color:var(--muted)}
.msg a{color:#4a7a17;font-weight:600}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
var p=new URLSearchParams(location.search), f=(p.get('f')||'').replace(/[^a-z0-9.\-]/gi,''), n=p.get('n')||'SDS Sheet';
var msg=document.getElementById('msg'), pages=document.getElementById('pages');
document.getElementById('title').textContent=n; document.title=n+' · SDS';
document.getElementById('dl').href=f;
document.getElementById('back').addEventListener('click',function(e){ if(history.length>1&&document.referrer.indexOf(location.origin)===0){ e.preventDefault(); history.back(); } });
if(!/\.pdf$/i.test(f)){ msg.textContent='No sheet selected.'; return; }
if(!window.pdfjsLib){ msg.innerHTML='Viewer could not load. <a href="'+f+'">Open the PDF</a>'; return; }
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
pdfjsLib.getDocument(f).promise.then(function(pdf){
  msg.remove();
  var w=Math.min(pages.clientWidth-16, 900), dpr=Math.min(window.devicePixelRatio||1,2), slots=[];
  for(var i=1;i<=pdf.numPages;i++){ var c=document.createElement('canvas'); c.dataset.p=i; c.style.width=w+'px'; c.style.aspectRatio='8.5/11'; pages.appendChild(c); slots.push(c); }
  function draw(c){ if(c.dataset.done) return; c.dataset.done=1;
    pdf.getPage(+c.dataset.p).then(function(pg){ var v0=pg.getViewport({scale:1}), s=w/v0.width, v=pg.getViewport({scale:s*dpr});
      c.width=v.width; c.height=v.height; c.style.aspectRatio=(v.width/v.height)+''; return pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise; }); }
  if('IntersectionObserver' in window){ var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ draw(e.target); io.unobserve(e.target); } }); },{rootMargin:'800px'}); slots.forEach(function(c){ io.observe(c); }); }
  else slots.forEach(draw);
}).catch(function(){ msg.innerHTML='Could not open this sheet. <a href="'+f+'">Try opening the PDF directly</a>'; });
})();
</script>
