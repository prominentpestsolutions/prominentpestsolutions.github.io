<title>Trap Checks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f2f4ee;--surface:#fff;--sunk:#e8ece2;--ink:#111410;--muted:#596052;--line:#d6dccd;--accent:#89c43e;--accent-ink:#0b0d09;--accent-soft:#e7f3d6;--ok:#4a7a17;
--warn:#a96d12;--warn-soft:#f6e7cc;--crit:#b3261e;--crit-soft:#f6d9d6;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;
--warn:#e3a94c;--warn-soft:#3a2d15;--crit:#ef7d72;--crit-soft:#3d1c19;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
h2{font:700 1.9rem/1.05 var(--display);margin:0}
h3{font:700 1.15rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:8px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--sunk);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{min-height:38px;padding:0 12px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;min-height:56px;font-size:1.15rem}
input,select,textarea{width:100%;min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:10px}
.t{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;box-shadow:inset 4px 0 0 var(--ok)}
.t.warn{box-shadow:inset 4px 0 0 var(--warn)}.t.crit{box-shadow:inset 4px 0 0 var(--crit);background:var(--crit-soft)}
.t .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.t .addr{font-weight:700;font-size:1.08rem;line-height:1.25;text-decoration:none;color:var(--ink)}
.t .meta{color:var(--muted);font-size:.92rem}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.82rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit);color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tech{min-height:64px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font:600 1.25rem var(--display);padding:8px}
.tech[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:48px;height:48px;border-radius:12px;font:700 1.6rem var(--display);background:var(--sunk);border:1px solid var(--line)}
.step output{font:700 1.8rem var(--mono);min-width:40px;text-align:center}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.res button{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:6px 10px;text-align:left}
.res button small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.res button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.res button[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.note{padding:10px 14px;border-radius:10px;background:var(--warn-soft);font-size:.95rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.5rem;margin-bottom:4px}
.log{display:grid;grid-template-columns:110px 1fr;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.log .w{color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
</style>

        if(!S.f.address) S.f.address=st?st+(city?', '+city:''):(x.display_name||'').split(',').slice(0,3).join(',');
        document.getElementById('toast').hidden=true; if(S.view==='new') render(); }).catch(function(){ document.getElementById('toast').hidden=true; if(S.view==='new') render(); }); },
      function(){ toast('Location permission was denied.'); },{enableHighAccuracy:true,timeout:12000}); }
  else if(a==='saveNew'){ var f=S.f, it=S.items.filter(function(i){return i.id===f.itemId;})[0];
    if(!f.address||!f.address.trim()){ toast('Enter the address.'); return; }
    S.me=f.tech; store('trapMe',f.tech);
    queue({fn:'trapSet',tech:f.tech,branch:f.branch,itemId:f.itemId,item:it?it.name:'Trap',qty:f.qty,address:f.address.trim(),lat:f.lat,lng:f.lng,target:f.target,job:(f.job||'').trim(),notes:(f.notes||'').trim(),every:+f.every||24});
    toast('Trap set — check due in '+(+f.every||24)+' hours'); go('home'); }
  else if(a==='check'){ var t=byId(b.getAttribute('data-id')); S.sel=t.id; S.c={tech:S.me&&S.techs.indexOf(S.me)>=0?S.me:t.tech,result:'',animal:t.target||'',count:1,keep:false,notes:''}; go('check'); }
  else if(a==='result'){ S.c.result=b.getAttribute('data-v'); render(); }
  else if(a==='animal'){ S.c.animal=b.getAttribute('data-v'); render(); }
  else if(a==='cinc'){ S.c.count++; render(); }
  else if(a==='cdec'){ S.c.count=Math.max(1,S.c.count-1); render(); }
  else if(a==='keep'){ S.c.keep=b.getAttribute('data-v')==='1'; render(); }
  else if(a==='saveCheck'){ var c=S.c, tr=byId(S.sel); S.me=c.tech; store('trapMe',c.tech);
    queue({fn:'trapCheck',trapId:S.sel,tech:c.tech,result:c.result,animal:c.animal,count:c.result==='Caught'?c.count:0,keep:!!c.keep,notes:(c.notes||'').trim()});
    var pulled=c.result==='Pulled'||(c.result==='Caught'&&!c.keep);
    toast(pulled?'Trap pulled \u2014 return it in Equipment when it\u2019s back at the shop':'Check saved — next one due in '+(tr?tr.every:24)+' hours'); go('home'); }
});
setInterval(function(){ if(S.view==='home') render(); },60000);
setInterval(function(){ if(S.view==='home') load(); },120000);
fromCache(); render(); load(); flush();
})();
</script>
